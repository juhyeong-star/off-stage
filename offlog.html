  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 0 20px}
.nav button{flex:1;background:none;border:none;color:var(--muted);font-family:inherit;font-size:11px;font-weight:700;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0;-webkit-tap-highlight-color:transparent}
.nav button i{font-style:normal;font-size:24px;line-height:1;opacity:.7;display:flex;align-items:center;justify-content:center;height:27px}
/* 아이콘 = 전부 27px SVG로 통일 (유니코드 글리프는 글자마다 크기가 달라 들쭉날쭉했음) */
.nav button i svg{width:27px;height:27px;display:block}
.nav button.on{color:var(--mint)}
.nav button.on i{opacity:1}
.nav button:active{transform:scale(.92);transition:transform .08s ease-out}
.nav button:focus-visible{outline:2px solid var(--mint);border-radius:8px}
/* 마이 탭 = 프로필 아바타 (우측) */
.avimg{display:block;width:27px;height:27px;border-radius:50%;background:var(--card2) center/cover no-repeat;border:1.5px solid transparent}
.nav button.on i .avimg{border-color:var(--mint)}
/* 음악 = 하단 가운데 살짝 떠오른 원 */
.navctr{position:relative}
.navctr i{width:48px;height:48px!important;border-radius:50%;background:var(--card2);border:1.5px solid var(--mint);
  display:flex;align-items:center;justify-content:center;font-size:21px!important;color:var(--mint);
  margin-top:-16px;opacity:1!important;transition:all .25s;
  box-shadow:0 0 0 4px var(--bg),0 4px 14px rgba(0,0,0,.6)}
.navctr i svg{width:25px;height:25px}
.navctr:active i{transform:translateY(-2px)}
.navctr.on i{background:var(--mint);color:#04231d;
  box-shadow:0 0 0 4px var(--bg),0 0 20px rgba(83,224,200,.55)}
/* ── 하단 가운데: camera | logs 슬라이딩 토글 (＋ 자리) ── */
.navseg{flex:1.9;align-self:center;position:relative;display:flex;align-items:center;
  background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:3px;margin:0 5px;height:36px}
.nsgpill{position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:calc(100% - 6px);
  border-radius:99px;background:var(--mint);transition:transform .26s cubic-bezier(.22,.61,.36,1)}
.navseg.logs .nsgpill{transform:translateX(100%)}
/* .nav button 규칙(세로정렬·민트 on색)을 이겨야 해서 .nav 로 한 단계 더 좁힌다 */
.nav .nsg{position:relative;z-index:1;flex:1;background:none;border:0;color:var(--muted);
  display:flex;flex-direction:row;align-items:center;justify-content:center;gap:0;
  font-family:inherit;font-size:12px;font-weight:800;padding:0;height:100%;min-height:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:color .2s}
.nav .nsg.on{color:#04231d}
.nav .nsg:active{transform:scale(.94)}
/* ── 앱 안 촬영 화면 ── */
.camview{position:absolute;left:0;right:0;top:0;bottom:64px;z-index:70;background:#000;overflow:hidden}
.camvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.camvid.mirror{transform:scaleX(-1)}
/* .camx 는 위 .slx,.camx,.sldots 공통 규칙(42px)을 그대로 쓴다 */
.cambar{position:absolute;left:0;right:0;bottom:22px;z-index:6;display:flex;align-items:center;justify-content:center;gap:36px}
.camshot{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.18);border:5px solid #fff;cursor:pointer;transition:transform .12s}
.camshot:active{transform:scale(.92)}
.camshot.rec{background:#ff4d4d;border-color:#ffb3b3}
.camsub{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.25);color:#fff;font-size:19px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;backdrop-filter:blur(6px)}
.camsub:active{transform:scale(.9)}
.camhint{position:absolute;left:0;right:0;bottom:106px;z-index:6;text-align:center;
  color:rgba(255,255,255,.72);font-size:11.5px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.camerr{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;color:#fff;text-align:center;padding:0 34px;font-size:13.5px;line-height:1.6}
.camerr .cs-post{max-width:240px}
/* 마이 → 내 플레이리스트 진입 (음악 탭이 하단에서 빠져 여기로) */
.myplrow{display:flex;align-items:center;justify-content:space-between;width:100%;margin:0 0 12px;
  background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px 15px;
  color:var(--txt);font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer}
.myplrow span{color:var(--muted);font-weight:700}
.myplrow:active{transform:scale(.99)}
/* ── 마이: LOG | WORKS ── */
.mprof{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 16px;text-align:center}
.mprof .smile{width:64px;height:64px}
.mprof .smile svg{width:44px;height:44px}
.mprof h3{font-size:17px;font-weight:700}
.mprof p{font-size:11px;color:var(--muted)}
.mprof .smile{cursor:pointer}
.fcount{display:flex;align-items:center;gap:16px;margin-top:9px}
.fc{background:none;border:none;color:var(--txt);font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 4px}
.fc b{font-family:'Black Han Sans';font-size:15px;letter-spacing:.5px}
.fc small{font-size:9.5px;color:var(--muted)}
.fc:hover b{color:var(--mint)}
.fc:focus-visible{outline:2px solid var(--mint);border-radius:8px}
.fcdiv{width:1px;height:22px;background:var(--line)}
.people{position:relative}
.pdot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--mint);
  box-shadow:0 0 6px var(--mint)}
.srch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:10px 12px;margin-bottom:14px}
.srchi{color:var(--muted);font-size:14px;flex-shrink:0}
.srch input{flex:1;background:none;border:none;color:var(--txt);font-family:inherit;font-size:13px;outline:none;min-width:0}
.srch input::placeholder{color:#55555d}
.srch:focus-within{border-color:var(--mint)}
.srchx{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;padding:2px 4px;flex-shrink:0}
/* 친구 초대 — 검색창 바로 아래. 찾는 사람이 아직 OFFLOG에 없을 때의 다음 행동. */
.invbtn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
  background:var(--mint);color:#0e0e12;border:none;border-radius:13px;padding:12px;margin-bottom:14px;
  font-family:'Black Han Sans';font-weight:400;font-size:13px;letter-spacing:.3px;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.invbtn small{font-family:'Inter',sans-serif;font-size:11px;opacity:.62;letter-spacing:0}
.invbtn:active{transform:scale(.985)}
.seg button b{font-family:'Black Han Sans';font-weight:400;font-size:11px;color:var(--muted);margin-left:3px}
.seg button.on b{color:var(--mint)}
.prow{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line)}
.pgo{display:flex;align-items:center;gap:11px;flex:1;min-width:0;cursor:pointer}
.pnm{min-width:0}
.pnm b{font-size:13.5px;font-weight:700;display:block}
.pnm small{font-size:10.5px;color:var(--muted)}
.plfol{flex-shrink:0}
.svgo{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.svgo b{font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:18px}
.seg button{flex:1;border:none;background:transparent;color:var(--muted);font-family:'Fredoka';font-size:12.5px;
  letter-spacing:.12em;font-weight:600;padding:9px 0;border-radius:99px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--txt)}
/* My 페이지 LOG/MUSIC 탭 — 선택하면 테마색(민트) 네온 테두리 */
.seg.profseg button.on{background:var(--card);color:var(--mint);border:1.5px solid var(--mint);
  box-shadow:0 0 8px rgba(83,224,200,.65),0 0 16px rgba(83,224,200,.35),inset 0 0 6px rgba(83,224,200,.2)}
.seg button:focus-visible{outline:2px solid var(--mint)}

.workrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:13px;margin-bottom:10px}
.wthumb{width:56px;height:56px;border-radius:12px;flex-shrink:0;position:relative;overflow:hidden}
.wplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28);
  border:none;color:#fff;font-size:15px;cursor:pointer}
.wplay:focus-visible{outline:2px solid #fff}
.winfo{flex:1;min-width:0}
.winfo b{font-size:15px;font-weight:700;display:block}
.winfo small{font-size:11px;color:var(--muted)}
.openst{background:transparent;border:1px solid var(--mint);color:var(--mint);border-radius:99px;
  padding:7px 13px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0}
.openst:focus-visible{outline:2px solid var(--mint)}

/* ── Work: 참여 중인 이벤트 ── */
.evstat.one{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:11px 13px;margin:0 0 10px}
.evbadge{font-size:9px;font-weight:700;color:var(--mint);border:1px solid rgba(83,224,200,.35);
  border-radius:99px;padding:2px 7px;flex-shrink:0}
.evstat.one b{font-size:13px;font-weight:700;flex:1;min-width:0}
.evcd{font-family:'Black Han Sans';font-size:11px;color:var(--lemon);letter-spacing:.5px;flex-shrink:0}
.evstat.one.confirmed{border-color:var(--lemon);background:rgba(255,243,166,.06)}
.evbadge.confirmed{background:var(--lemon);color:#2b2417;border-color:var(--lemon)}

/* ── Work — 음악이 위, 그 아래 모든 로그 ── */
/* ── 발매·아티스트 상세 — Spotify / YT Music 식(박스 대신 커버 + 색 그라데이션 + 큰 재생) ── */
.whero2{position:relative;padding:6px 2px 8px;margin:0 0 4px}
.whero2::before{content:'';position:absolute;top:-70px;left:-16px;right:-16px;height:360px;z-index:0;pointer-events:none;
  background:radial-gradient(120% 78% at 50% 0, var(--acc,#3a3a44), transparent 60%);opacity:.30}
.wcov2{position:relative;z-index:1;width:62%;max-width:220px;aspect-ratio:1;margin:8px auto 18px;border-radius:14px;
  box-shadow:0 18px 44px rgba(0,0,0,.55);background-color:#141418;background-size:cover;background-position:center;
  display:flex;align-items:center;justify-content:center}
.wcov2.empty{border:1px dashed rgba(255,255,255,.16)}
.wcov-hint{text-align:center;font-size:21px;color:var(--muted);line-height:1.55}
.wtitle2{position:relative;z-index:1;font-family:'Archivo Black','Black Han Sans',sans-serif;font-size:25px;line-height:1.12;letter-spacing:-.01em;margin:0 4px 7px;word-break:break-word}
.wsub2{position:relative;z-index:1;display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:0 4px 16px;font-size:13px;color:var(--muted)}
.wartist{background:none;border:0;color:var(--txt);font-weight:700;font-size:13px;cursor:pointer;padding:0}
.wartist:active{opacity:.55}
.wsub2 .wdot{opacity:.45}
.wactions{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;margin:0 2px}
.wicons{display:flex;gap:2px}
.wicon{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);cursor:pointer;padding:5px 11px;min-width:50px;-webkit-tap-highlight-color:transparent}
.wicon span{font-size:19px;line-height:1}
.wicon i{font-style:normal;font-size:10.5px}
.wicon.acc{color:var(--lemon)}
.wicon:active{transform:scale(.9)}
/* 아이콘은 문자 대신 도형 — ⏸ 는 iOS 가 이모지로 그려서 color 가 무시된다(.miniplay 주석 참고) */
.wplay2{width:56px;height:56px;border-radius:50%;background:var(--mint);border:0;color:#07110e;font-size:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(80,230,190,.42);flex-shrink:0}
.wplay2::before{content:'';display:block;width:16px;height:18px;background:currentColor;
  clip-path:polygon(0 0,100% 50%,0 100%);margin-left:3px}
.wplay2.on::before{clip-path:none;margin-left:0;
  background:linear-gradient(to right,currentColor 0 34%,transparent 34% 66%,currentColor 66% 100%)}
.wplay2:active{transform:scale(.93)}
.wrelbar{position:relative;z-index:1;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:16px 4px 0}
.wrelbar b{color:var(--lemon)}
.wrelbar .relx{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);border-radius:9px;font-size:11px;padding:4px 11px;cursor:pointer}
.wsec{border-top:1px solid var(--line);padding:14px 4px 2px;margin-top:10px}
.wsec-t{font-size:11px;font-weight:800;color:var(--mint);letter-spacing:.04em;margin-bottom:8px}
.wcredits{display:flex;flex-wrap:wrap;gap:7px 16px;font-size:13px;color:var(--muted)}
.wcredits b{color:var(--txt);font-weight:700}
.wlyr{font-family:'Gaegu','Noto Sans KR',sans-serif;font-size:15px;line-height:1.75;color:var(--txt);white-space:pre-wrap}
.whero{border-radius:24px;overflow:hidden;border:1px solid var(--line);margin-bottom:6px}
.wcover{height:210px;position:relative;cursor:pointer}
.wcover .bgimg{position:absolute;inset:0;background-size:cover;background-position:center}
.wmeta{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.82))}
.wmeta h2{font-family:'Black Han Sans';font-size:26px;letter-spacing:.5px;color:#fff}
.wmeta small{font-size:11px;color:rgba(255,255,255,.78)}
.wbtns{display:flex;gap:8px;padding:12px;background:var(--card)}
.wbtns .cta{flex:1;padding:12px}
.savebtn{flex:1;background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:13px;
  padding:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.savebtn.on{border-color:var(--mint);color:var(--mint)}
.savebtn:focus-visible{outline:2px solid var(--mint)}

.mchips{display:flex;gap:6px;overflow-x:auto;margin:2px 0 14px;scrollbar-width:none;padding-bottom:2px}
.mchips::-webkit-scrollbar{display:none}
.mchip{background:var(--card2);border:1px solid var(--line);color:var(--muted);border-radius:99px;
  padding:6px 13px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.mchip.on{background:var(--mint);border-color:var(--mint);color:#04231d}
.mchip:focus-visible{outline:2px solid var(--mint)}

.daytl{border-left:1.5px dashed var(--line);margin:4px 0 8px 9px;padding-left:17px}
.dayhd{position:relative;display:flex;align-items:baseline;gap:8px;margin:20px 0 10px}
.dayhd::before{content:'';position:absolute;left:-23px;top:3px;width:10px;height:10px;border-radius:50%;
  background:var(--mint);border:2px solid var(--bg)}
.dayhd b{font-family:'Black Han Sans';font-size:16px;letter-spacing:.5px}
.dayhd small{font-size:10.5px;color:var(--muted);font-family:'Black Han Sans'}
.dayhd.rel::before{background:var(--lemon);box-shadow:0 0 10px var(--lemon)}
.dayhd.rel b{color:var(--lemon)}
/* ── 새 로그 작성 시트 (마이 ＋) ── */
#composeview:empty{display:none}
/* 인앱 확인창 — 브라우저 기본 confirm() 대체 (offConfirm 주석 참고). 웹뷰·하단바까지 덮어야 해서 fixed */
.ocf-bd{position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:26px}
.ocf{width:100%;max-width:320px;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:22px 20px 16px}
.ocf-msg{color:var(--txt);font-size:14px;line-height:1.65;margin:0 0 18px;white-space:pre-line;text-align:center}
.ocf-btns{display:flex;gap:9px}
.ocf-btns button{flex:1;min-height:46px;border-radius:12px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.ocf-no{background:transparent;border:1px solid var(--line);color:var(--muted)}
.ocf-ok{background:var(--mint);border:0;color:#0b0b0d}
.ocf-no:active,.ocf-ok:active{transform:scale(.98)}
.cs-bd{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.cs{width:100%;background:var(--card2);border-top-left-radius:22px;border-top-right-radius:22px;border-top:1px solid var(--line);
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:csup .22s ease}
@keyframes csup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.cs-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cs-hd b{font-family:'Black Han Sans';font-size:16px}
.cs-x{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  color:var(--muted);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.cs-x:active{transform:scale(.92)}
.cs-ta{width:100%;min-height:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;
  color:var(--txt);padding:12px;font-size:16px;font-family:'Gaegu','Noto Sans KR',sans-serif;resize:none;line-height:1.5}
.cs-ta:focus{outline:2px solid var(--mint)}
.cs-prev{position:relative;margin-top:10px;border-radius:14px;overflow:hidden;max-height:230px;background:#000}
.cs-rm{position:absolute;top:8px;right:8px;width:30px;height:30px;border:0;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;backdrop-filter:blur(4px);z-index:2}
.cs-rm:active{transform:scale(.9)}
.cs-prev img,.cs-prev video{width:100%;display:block;max-height:230px;object-fit:contain}
.cs-row{display:flex;gap:8px;margin-top:12px}
.cs-add{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px;font-size:13.5px;min-height:44px}
.cs-add:hover{border-color:var(--mint);color:var(--mint)}
.cs-post{margin-top:12px;width:100%;background:var(--mint);color:#04231d;border:0;border-radius:14px;padding:13px;font-weight:800;font-size:15px;min-height:48px}
.cs-post:disabled{opacity:.4}
/* 릴스에서 듣던 곡 담기 */
/* .sldots(릴스 담기 ⋯) 는 위 공통 원형 규칙(42px, ✕ 왼쪽)을 그대로 쓴다 */
.cs-trk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13px;color:var(--muted);margin-bottom:12px}
.cs-trk b{color:var(--txt)}
/* 한 박스에서 끼워넣기 — 사진·영상·데모 첨부 버튼 행 */
.cs-attach{display:flex;gap:8px;margin-top:12px}
.cs-att{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 0;font-size:19px;min-height:56px}
.cs-att span{font-size:11.5px;color:var(--muted);font-weight:700}
.cs-att.txt{font-size:13px;font-weight:700;min-height:44px;justify-content:center}   /* 텍스트만(이모지 없는) 칩 — 활동 태그 */
.cs-att:active{transform:scale(.95)}
.cs-att.on{border-color:var(--mint);background:rgba(80,230,190,.1)}
.cs-att.on span{color:var(--mint)}
.cs-prev.aud{min-height:auto;background:var(--card);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;padding:20px;color:var(--mint);font-weight:700}
.composebtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;width:100%;margin:0 0 14px;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:22px 14px;font-family:inherit;cursor:pointer}
.composebtn .cplus{display:flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:50%;border:1.5px solid var(--line);font-size:26px;color:var(--txt);line-height:1}
.composebtn .clabel{font-size:13.5px;font-weight:700;color:var(--muted)}
.composebtn:hover{border-color:var(--mint)}
.composebtn:hover .cplus{border-color:var(--mint);color:var(--mint)}
.composebtn:active{transform:scale(.99)}
/* 새 작품 이름 입력 / 플레이리스트 이름 */
.cs-name{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:13px;font-size:17px;font-family:'Black Han Sans';letter-spacing:-.01em}
.cs-name:focus{outline:2px solid var(--mint)}
.lhname{background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--txt);font-family:'Black Han Sans';font-size:22px;width:100%;padding:2px 0}
.lhname:focus{outline:0;border-bottom-color:var(--mint)}
/* 새 작품 만들기 버튼 (마이 WORKS) */
.newwork{display:block;width:100%;margin:0 0 12px;background:transparent;border:1.5px dashed var(--line);color:var(--txt);border-radius:16px;padding:15px;font-size:14px;font-weight:700;min-height:48px}
.newwork:hover{border-color:var(--mint);color:var(--mint)}
/* 음원 발매 / 공연 지원 — 나란한 2박스 (마이 MUSIC·CONCERT 탭) */
.newwork2{display:flex;gap:9px;margin:0 0 12px}
.nw2{flex:1;background:transparent;border:1.5px dashed var(--line);color:var(--txt);border-radius:16px;
  padding:14px 6px;font-size:12.5px;font-weight:700;min-height:64px;text-align:center;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nw2 em{font-style:normal;font-size:20px;line-height:1}
.nw2.music:hover{border-color:var(--mint);color:var(--mint)}
.nw2.perf:hover{border-color:var(--coral);color:var(--coral)}

/* 추천 팔로우 — 빈 피드(신규 가입자)에서 아티스트 추천 행 */
.recorow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:10px 12px;margin-bottom:8px}
.recoav .avimg,.recoav .smile{width:38px;height:38px;border-radius:50%}
/* 메인 이벤트 배너 — 캘린더 아래, 16:9 이미지 위에 글이 얹힌 큰 카드.
   2초마다 다음 이벤트로 넘어간다. */
.evbn{position:relative;display:block;width:100%;aspect-ratio:16/9;margin:2px 0 14px;padding:0;
  background:var(--card2);border:1px solid var(--line);border-radius:16px;cursor:pointer;
  text-align:left;-webkit-tap-highlight-color:transparent;overflow:hidden}
.evbn:active{transform:scale(.99)}
.evbimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* 이미지가 아직 안 왔거나 밝게 나와도 글자가 항상 읽히도록 한 겹 더 */
.evbveil{position:absolute;inset:0;
  background:linear-gradient(to top, rgba(6,6,10,.88) 0%, rgba(6,6,10,.55) 32%, rgba(6,6,10,.06) 66%, transparent 100%)}
.evbtop{position:absolute;top:12px;left:12px;display:flex;gap:6px}
.evbtag{font-family:'Black Han Sans';font-weight:400;font-size:11.5px;letter-spacing:.4px;
  color:#0e0e12;background:var(--mint);border-radius:999px;padding:5px 10px}
.evbtag.lemon{background:var(--lemon)}
.evbtag.shpink{background:var(--shpink)}
.evbbot{position:absolute;left:14px;right:14px;bottom:13px;display:flex;flex-direction:column;gap:3px}
.evbnm{font-family:'Black Han Sans';font-weight:400;font-size:19px;letter-spacing:.2px;color:#fff;
  line-height:1.22;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-shadow:0 1px 10px rgba(0,0,0,.5)}
.evbsub{font-size:12px;color:rgba(255,255,255,.82);line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.5)}
/* 점은 오른쪽 위 — D-day 태그 맞은편. 아래에 두면 8개가 길어서 제목과 겹친다 */
.evbdots{position:absolute;right:13px;top:17px;display:flex;gap:4px}
.evbdots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.34);
  box-shadow:0 1px 4px rgba(0,0,0,.45)}
.evbdots i.on{background:#fff}
/* 흰(bare) 배너에선 점을 어둡게 — 흰 위의 흰 점은 안 보인다 */
.evbn.bare .evbdots i{background:rgba(0,0,0,.22);box-shadow:none}
.evbn.bare .evbdots i.on{background:#111}
/* 좌우 절반 탭 = 이전/다음. 가운데 34%는 비워 둬서 그 이벤트로 들어가는 길을 남긴다 */
.evbnav{position:absolute;top:0;bottom:0;width:33%;background:none;border:0;padding:0;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.evbnav.prev{left:0}
.evbnav.next{right:0}
.evbdots i{cursor:pointer}
/* 점은 5px이라 그대로면 누르기 어렵다 — 보이는 크기는 두고 터치 영역만 넓힌다 */
.evbdots i{position:relative}
.evbdots i::after{content:'';position:absolute;inset:-9px}
.evbin{animation:evbfade .4s cubic-bezier(.22,1,.36,1)}
@keyframes evbfade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){ .evbin{animation:none} }
/* 영상 자르기 시트 — 30초 하이라이트만 올리게 */
.trimsheet .trvid{width:100%;max-height:38vh;border-radius:14px;background:#000;display:block;margin:4px 0 12px}
.trbar{position:relative;height:8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);margin:2px 0 12px;overflow:hidden}
.trrange{position:absolute;top:0;bottom:0;background:var(--mint);opacity:.75}
.trrow{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.trlab{flex-shrink:0;width:30px;font-size:11.5px;color:var(--muted)}
.trsl{flex:1;min-width:0;accent-color:var(--mint);height:26px}
.trval{flex-shrink:0;width:46px;text-align:right;font-family:'Black Han Sans';font-weight:400;font-size:12.5px;color:var(--txt)}
.trsum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 12px}
.trsum b{color:var(--txt);font-family:'Black Han Sans';font-weight:400}
.trsum.over{color:#ff8080}
.trsum.over b{color:#ff8080}
.trplay{margin-left:auto;background:none;border:1px solid var(--line);border-radius:99px;
  color:var(--mint);font-size:11.5px;padding:6px 11px;cursor:pointer;font-family:inherit}
/* 이름이 이메일 앞부분인 사람에게만 보이는 조용한 안내 (본인만 봄) */
.namehint{display:block;width:100%;margin:0 0 10px;padding:10px 13px;background:none;
  border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:12px;
  text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.namehint b{color:var(--txt);font-weight:700}
.namehint:active{transform:scale(.99)}
/* 비공개 로그 일괄 공개 — 카드마다 칩을 누르는 건 현실적으로 아무도 안 한다 */
.privbar{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 12px;padding:12px 14px;
  background:var(--card2);border:1px dashed var(--line);border-radius:14px;cursor:pointer;text-align:left;
  -webkit-tap-highlight-color:transparent}
.privbar:active{transform:scale(.99)}
.pbtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pbtx b{font-family:'Black Han Sans';font-weight:400;font-size:12.5px;letter-spacing:.3px;color:var(--txt)}
.pbtx small{font-size:11px;color:var(--muted)}
.pbgo{flex-shrink:0;font-family:'Black Han Sans';font-weight:400;font-size:11.5px;letter-spacing:.3px;
  color:#0e0e12;background:var(--mint);border-radius:999px;padding:7px 11px}
/* 내 로그에 새 댓글 — 홈 상단 한 줄. 알림이 없어서 대화가 시작되지 않던 걸 잇는다 */
.cmtalert{display:flex;align-items:center;gap:10px;width:100%;margin:2px 0 10px;padding:11px 13px;
  background:var(--card2);border:1px solid var(--mint);border-radius:14px;cursor:pointer;text-align:left;
  -webkit-tap-highlight-color:transparent}
.cmtalert:active{transform:scale(.99)}
.cashp{flex-shrink:0;display:flex;align-items:center}
.catx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.catx b{font-family:'Black Han Sans';font-weight:400;font-size:12.5px;letter-spacing:.3px;color:var(--txt)}
.catx small{font-family:'Gaegu','Caveat',cursive;font-size:12.5px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cago{flex-shrink:0;color:var(--mint);font-size:17px}
/* 이름 + 최근 로그 한 줄 미리보기(2단) — 팔로우하면 뭐가 보이는지 먼저 알려준다 */
.reconm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.reconm b{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reconm small{font-family:'Gaegu','Caveat',cursive;font-size:12.5px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recofol{flex-shrink:0}

/* 진행중인 프로젝트 — 홈 LOG 피드 맨 위, 그룹 박스 하나씩 세로로 */
.projrow{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.projbox{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:13px 14px;cursor:pointer;font-family:inherit}
.projbox:hover{border-color:var(--mint)}
.projhd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.projhd b{font-family:'Black Han Sans';font-size:14.5px;letter-spacing:.01em}
.projtype{flex-shrink:0;font-size:10px;font-weight:700;color:var(--mint);background:rgba(83,224,200,.1);
  border-radius:99px;padding:3px 9px}
.projwho{font-size:11px;color:var(--muted);margin-top:3px}
.projwhat{font-size:12.5px;color:var(--txt);margin-top:5px;line-height:1.4}
/* 앨범 정보 (Work 상세) */
.albuminfo{margin:14px 0 4px;display:flex;flex-direction:column;gap:12px}
.ai-sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ai-t{font-size:11px;font-weight:800;color:var(--mint);letter-spacing:.04em;margin-bottom:7px}

.ai-cr b{color:var(--txt);font-weight:700;margin-left:3px}
.ai-lyr{font-family:'Gaegu','Noto Sans KR',sans-serif;font-size:15px;line-height:1.7;color:var(--txt);white-space:pre-wrap}
.ai-dsp{display:flex;flex-wrap:wrap;gap:6px}
.ai-dsp span{font-size:11.5px;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:4px 11px}
/* 실사 아바타 */
.avimg{display:inline-block;border-radius:50%;background-size:cover;background-position:center;flex-shrink:0;vertical-align:middle;overflow:hidden}
/* 사진은 span 배경이 아니라 안의 img 로 — 배경이미지+둥근 클리핑이 팔각형으로 근사되는 렌더링 문제 회피 */
.avimg img{width:100%;height:100%;object-fit:cover;display:block}
/* 이름 첫 글자 아바타 — 사진이 없을 때 (initialEl 주석 참고) */
.avini{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;
  vertical-align:middle;font-weight:800;line-height:1;user-select:none;-webkit-user-select:none}
/* 프로필 사진 바꾸기 버튼 · 프로필 수정 · 공개범위 */
.avedit{position:relative;background:none;border:0;padding:0;cursor:pointer;display:inline-flex}
.avcam{position:absolute;right:0;bottom:2px;width:28px;height:28px;border-radius:50%;background:var(--card2);
  border:1.5px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px}
.avedit:active{transform:scale(.96)}
.acedit{margin-top:8px;background:none;border:1px solid var(--line);color:var(--txt);border-radius:99px;
  font-family:inherit;font-size:12px;font-weight:700;padding:7px 16px;cursor:pointer}
.acedit:active{border-color:var(--mint);color:var(--mint)}
.acvis{width:100%;display:flex;align-items:flex-start;gap:11px;background:none;border:0;border-bottom:1px solid var(--line);
  padding:13px 2px;text-align:left;color:var(--txt);font-family:inherit;cursor:pointer}
.acvis:last-of-type{border-bottom:0}
.acvis .pknm b{font-size:13.5px;font-weight:700;display:block}
.acvis .pknm small{font-size:11px;color:var(--muted)}
.acvis.on .pknm b{color:var(--mint)}
.acvisnote{font-size:11px;color:var(--muted);line-height:1.6;margin:2px 2px 0;padding-top:9px;border-top:1px solid var(--line)}
.mprof .mpav .avimg{width:92px;height:92px;border:2px solid rgba(255,255,255,.12)}
.mprof .mpav .smile{width:92px;height:92px}
.mprof .mpav .smile svg{width:54px;height:54px}
.circ .avimg{width:34px;height:34px}
/* 로그인 시트 */
.authbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:13px;padding:13px;font-size:14.5px;font-weight:700;margin-bottom:8px;min-height:48px}
.authbtn b{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:50%;background:#fff;color:#000;font-size:12px;font-weight:900}
.authbtn.kakao b{background:#FEE500;color:#000}
/* Apple 로그인 — 애플 심사 4.8 요구. 어두운 배경이라 흰 버튼(애플 HIG 규격) */
.authbtn.apple{background:#fff;color:#000;border-color:#fff}
.authbtn.apple svg{width:17px;height:17px;margin-top:-2px}
.authbtn.apple:hover{border-color:#fff;opacity:.92}
.authbtn.kakao{background:#FEE500;color:#191919;border-color:#FEE500}
.authbtn.kakao:hover{border-color:#FEE500;opacity:.92}
.authbtn:hover{border-color:var(--mint)}
/* 로그인 ↔ 회원가입 전환 · 비밀번호 찾기 */
/* 이용약관 동의 (앱스토어 Guideline 1.2 — 가입 전 무관용 원칙 동의) */
.agree{display:flex;align-items:flex-start;gap:9px;margin-top:12px;padding:0 2px}
.agree input[type=checkbox]{width:19px;height:19px;flex-shrink:0;margin-top:1px;accent-color:var(--mint)}
.agree label{font-size:11.5px;color:var(--muted);line-height:1.55;cursor:pointer}
.agree label b{color:var(--txt);font-weight:700}
.agreelink{display:block;margin:7px 0 0 30px;font-size:11.5px}

/* 약관은 잠금화면(z-index 60) 위에 떠야 한다 — 가입 전에 읽을 수 있어야 하므로 */
#tmbd{z-index:65}
.cs.tall{max-height:82%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain}
.tmbody{font-size:12.5px;color:var(--muted);line-height:1.75;padding:0 2px 6px}
.tmbody h4{font-size:13px;color:var(--txt);font-weight:800;margin:15px 0 5px}
.tmbody h4:first-child{margin-top:2px}
.tmbody b{color:var(--txt)}
.authalt{margin-top:14px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.7}
.authlink{background:none;border:0;padding:0 2px;color:var(--mint);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.authlink:active{opacity:.6}
.authsep{opacity:.4;margin:0 5px}
/* 로그인 잠금 / 스플래시 — 앱·하단바까지 전부 덮는다 */
.lockwrap{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.lockmid{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;text-align:center}
.lockmid.lockauth{align-items:stretch;text-align:left}
.locklogo{font-family:'Fredoka','Black Han Sans',sans-serif;font-weight:600;font-size:30px;color:var(--mint);letter-spacing:.03em;text-align:center}
.locksub{color:var(--muted);font-size:13px;margin:6px 0 20px;text-align:center}
.lockspin{width:26px;height:26px;margin-top:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--mint);animation:lspin .7s linear infinite}
@keyframes lspin{to{transform:rotate(360deg)}}
.authdiv{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11.5px;margin:14px 0 10px}
.authdiv::before,.authdiv::after{content:'';flex:1;height:1px;background:var(--line)}
.authinput{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:12px 13px;font-size:16px;margin-bottom:8px;font-family:inherit}
.authpwrow{position:relative}
.authpwrow .authinput{padding-right:44px}
.authpweye{position:absolute;right:6px;top:calc(50% - 4px);transform:translateY(-50%);background:none;border:none;
  font-size:17px;cursor:pointer;padding:6px;line-height:1;opacity:.65}
.authpweye:active{opacity:1}
.authinput:focus{outline:2px solid var(--mint)}
/* 곡 담기 검색창 + 미리듣기 행 */
.pksearch{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:11px 13px;font-size:16px;margin-bottom:8px;font-family:inherit}
.songrow{display:flex;align-items:center;gap:11px}
.songplay{width:38px;height:38px;flex-shrink:0;border-radius:50%;background:var(--card2);border:1px solid var(--line);color:var(--mint);font-size:13px;cursor:pointer}
.songplay.on{background:var(--mint);color:#04231d;border-color:var(--mint)}
.songrow .pknm{flex:1;min-width:0}
.songadd{flex-shrink:0;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:7px 13px;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;min-height:34px}
.songadd.on{background:var(--mint);border-color:var(--mint);color:#04231d}
.pksearch:focus{outline:2px solid var(--mint)}
/* 발매 로그 큐레이션 날짜 헤더 */
.pldate{font-family:'Black Han Sans';font-size:13px;color:var(--txt);margin:12px 2px 6px;padding-top:8px;border-top:1px solid var(--line)}
.pldate:first-of-type{border-top:0;padding-top:0}
/* ── Apple-style: 즉각 반응 + 반투명 유리 크롬 (간결·빠르게) ── */
button,[data-play],[data-slide],[data-story],[data-prof],[data-v],[data-room],
.av,.rcard,.tool,.fc,.shape,.fab,.cs-add,.cs-post,.fol,.slfol,.fc,.circ{ touch-action:manipulation }
/* 릴리즈가 아니라 '누르는 즉시' 반응 — 지연 없는 촉감 */
button,.rcard,.av,.tool,.circ,.fab,.fol,.slfol,.cs-add,.cs-post,.miniplay{ transition:transform .16s cubic-bezier(.22,.61,.36,1) }
button:active,.rcard:active,.av:active,.tool:active,.circ:active,.fab:active,
.fol:active,.slfol:active,.cs-add:active,.cs-post:active,.miniplay:active,
[data-story]:active,[data-prof]:active,.workrow:active{ transform:scale(.965); transition:transform .09s ease-out }
.shape{ transition:transform .12s cubic-bezier(.34,1.56,.64,1) }
.shape:active{ transform:scale(.82) }
/* 반투명 유리 크롬 — 콘텐츠가 아래로 흐른다 (불투명 막대 대신 재질) */
.nav{ background:rgba(13,13,16,.72)!important; backdrop-filter:blur(22px) saturate(155%); -webkit-backdrop-filter:blur(22px) saturate(155%); border-top:1px solid rgba(255,255,255,.06) }
.mini{ backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%) }
@media (prefers-reduced-transparency: reduce){ .nav{ background:#0d0d10!important; backdrop-filter:none } .mini{ backdrop-filter:none } }

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ── 실제 폰 규격 (≤640px): 데스크톱 프리뷰의 핑크 베젤은 유지, 폰에서는 풀스크린 앱 ── */
@media (max-width:640px){
  /* 뷰포트에 완전 고정 — 잡고 드래그해도 앱(목업) 전체가 안 밀리고 내부 .screen만 스크롤 */
  html{overflow:hidden;overscroll-behavior:none;height:100%}
  /* 100dvh = 사파리 주소창이 보일 때의 '실제 보이는 높이'. 100%면 주소창 뒤로 하단이 잘린다 */
  /* touch-action:none = 몸통(body)은 손가락 팬에 절대 안 밀린다. 스크롤은 .screen만 */
  body{display:block;padding:0;position:fixed;inset:0;height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:none;background:var(--bg)}
  /* 목업 프레임(핑크 베젤·라운드·그림자) 벗기고 화면을 꽉 채움 */
  .phone{max-width:none;width:100%;border:0;border-radius:0;box-shadow:none;height:100dvh;overflow:hidden}
  /* 세로 스크롤만 허용(pan-y) → 가로로 끌어도 화면이 안 따라 움직임. 스크롤 체이닝/바운스 차단 */
  .screen{height:100%;overscroll-behavior:contain;overflow-x:hidden;touch-action:pan-y;padding-bottom:calc(195px + env(safe-area-inset-bottom))}
  /* 앱이 화면 전체(상태바·홈바 아래까지)를 덮는다 — ContentView.swift 의 .ignoresSafeArea().
     그래서 가려지지 않을 만큼을 여기서 확보한다. 브라우저에선 env(...)가 0이라 값이 그대로 유지된다. */
  .screen{padding-top:calc(16px + env(safe-area-inset-top))}
  .slwho{top:calc(16px + env(safe-area-inset-top))}
  .slx,.camx,.sldots{top:calc(14px + env(safe-area-inset-top))}
  /* 슬라이드는 화면 전체를 덮는다 — 하단바까지. (기본 z-index 40 이 nav 20 보다 위)
     예전엔 bottom:64px 로 하단바 자리를 남겨서, 안전영역이 커진 기기에서 하단바가
     위쪽만 덮여 잘려 보였다. 어차피 여기선 하단바가 필요 없으니 통째로 덮는다.
     닫기는 슬라이드마다 있는 우측 상단 ✕. */
  .slwrap{bottom:0}
  /* 카메라는 자체 하단 컨트롤이 있어 통째로 덮으면 안 된다 — 하단바 자리만 정확히 비운다 */
  .camview{bottom:calc(64px + env(safe-area-inset-bottom))}
  /* 스토리 화면 — 세로 flex 의 첫 요소(진행바)를 안전영역만큼 내리면 헤더까지 같이 내려간다.
     안 하면 이름·시간이 상태바(시계·배터리)와 겹친다. 아래는 반응 버튼이 홈바에 닿지 않게. */
  .svbars{padding-top:calc(10px + env(safe-area-inset-top))}
  .svwrap{padding-bottom:env(safe-area-inset-bottom)}
  /* -webkit-overflow-scrolling:touch 제거 — iOS에서 .screen이 stacking context가 되어 발매 시트(z45)가 뮤직바(z19)/nav(z20) 아래로 깔리던 문제. iOS13+는 이 속성 없이도 관성 스크롤 정상 */
  /* iOS 홈바(34px)와 겹치지 않게 하단 네비/미니 안전영역 확보 */
  .nav{padding-bottom:max(18px, env(safe-area-inset-bottom))}
  .mini{bottom:calc(88px + env(safe-area-inset-bottom))}
  /* iOS 포커스 시 자동 확대 방지 — 입력 계열만 16px 이상 */
  .fld input,.cin,.lyr,.rdate,.srch input,input,textarea{font-size:16px}
  /* 터치 타깃 최소 44px (핵심 컨트롤) */
  .nav button{min-height:44px}
  .circ{width:44px;height:44px}
}
</style>
</head>

     capture="environment" 를 뺐다 — 그 속성은 카메라를 강제로 바로 열어서 (1) 올릴 때마다

<!-- 메인앱과 동일 Supabase SDK — 같은 도메인이라 로그인 세션이 자동 공유된다 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const V=getComputedStyle(document.documentElement), c=n=>V.getPropertyValue('--'+n).trim();
/* HTML 이스케이프 — DB/유저 문자열을 innerHTML에 넣기 전 반드시 통과(저장형 XSS 차단) */
const _ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,ch=>_ESC[ch]); }
/* 이미지 URL 안전 검사 — http(s) 또는 data:image 만 허용(CSS url()/attr 이스케이프 breakout 차단) */
function safeUrl(u){ u=String(u==null?'':u); return (/^https?:\/\//.test(u)||/^data:image\//.test(u)) && !/["'()\\<>\s]/.test(u) ? u : ''; }

/* ── 안전장치 (앱스토어 Guideline 1.2) ──────────────────────────────
   차단한 사람의 콘텐츠는 즉시 사라져야 하고, 신고가 쌓이면 자동으로 감춰져야 한다.
   supabase/safety.sql 의 blocks·reports·hidden_targets() 를 쓴다. */
const MYBLOCKS=new Set();   // 내가 차단한 사람 (auth user id)
const MYREPORTS=new Set();  // 내가 신고한 대상 'kind:id' — 신고한 순간 내 화면에서 감춘다
const HIDDEN=new Set();     // 여러 명이 신고해 자동 숨김된 대상 'kind:id' (모두에게)
let SAFETYTABLE=true;       // safety.sql 미실행이면 false 로 내려가고 조용히 통과
/* 차단한 사람의 이름 — 차단하면 그 사람 콘텐츠가 안 보이므로, 해제하려면
   따로 목록이 있어야 한다(콘텐츠 ⋯ 메뉴로는 다시 닿을 수 없다). */
const BLOCKEDNAMES={};
async function loadBlockedNames(){
  if(!SBC || !MYBLOCKS.size) return;
  try{
    const r=await SBC.from('profiles').select('id,name').in('id', Array.from(MYBLOCKS));
    if(r.error) throw r.error;
    (r.data||[]).forEach(function(p){ BLOCKEDNAMES[p.id]=p.name||'이름 없음'; });
  }catch(e){ console.warn('[offlog] 차단 목록 이름 로드 실패', e); }
}

function tKey(kind, id){ return String(kind||'')+':'+String(id||''); }
/* 감춰야 하는 항목인가 — 피드·발견·슬라이드 어디서나 같은 기준을 쓴다 */
function isHiddenItem(it){
  if(!it) return false;
  const aid=it.aid||it.artist_id||it.said||null;
  if(aid && MYBLOCKS.has(aid)) return true;
  const id=it.tid||it.id||null;
  if(!id) return false;
  const a=tKey('track',id), b=tKey('log',id);
  return MYREPORTS.has(a)||MYREPORTS.has(b)||HIDDEN.has(a)||HIDDEN.has(b);
}
/* 자동 숨김 목록 — 로그인 전에도 적용돼야 하므로 따로 불러온다 */
async function loadHidden(){
  if(!SBC||!SAFETYTABLE) return;
  try{
    const r=await SBC.rpc('hidden_targets');
    if(r.error) throw r.error;
    HIDDEN.clear();
    (r.data||[]).forEach(function(x){ HIDDEN.add(tKey(x.target_kind, x.target_id)); });
  }catch(e){
    if(e&&(e.code==='PGRST202'||/hidden_targets/i.test(String(e.message||'')))){
      SAFETYTABLE=false;
      console.info('[offlog] safety.sql 미실행 — 신고·차단은 이 기기에서만 동작합니다');
      return;
    }
    console.warn('[offlog] 숨김 목록 로드 실패', e);
  }
}

let AUTHREADY=false;   /* 로그인 여부 확인 완료 — 그 전엔 스플래시, 확인 후 !ME면 잠금 */
/* 로그인 폼 입력값 보존소 — 로그인↔회원가입 전환(render)마다 입력이 날아가던 문제.
   S 밖에 두는 이유: 입력마다 render()를 다시 돌리지 않기 위해(포커스 유지) */
const AUTHVALS={email:'', pw:'', name:'', showPw:false, showEmail:false /* 이메일 폼 펼침 여부 — 기본은 소셜 3버튼만 */};
let DATAREADY=false;   /* 실제 트랙 데이터 도착 완료 — 그 전엔 스플래시 유지(시드 목업이 진짜처럼 새는 걸 막음) */
/* 저장된 로그인 세션이 기기에 있는가 — 네트워크 없이 즉시 판단.
   이게 true면 "로그인한 사람"이므로 잠금 화면을 띄우면 안 된다(다시 로그인하라고 하면 안 됨). */
function hasStoredSession(){
  try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
    if(k && /^sb-.*-auth-token$/.test(k) && localStorage.getItem(k)) return true; } }catch(_){}
  return false;
}
async function loadMe(){
  if(!SBC){ ME=null; AUTHREADY=true; return null; }
  try{
    /* 저장된 세션을 먼저 로컬에서 읽는다(네트워크 왕복 없음).
       getUser()만 쓰면 통신이 느리거나 끊겼을 때 로그인이 풀린 것처럼 보인다. */
    let user=null;
    try{ const s=await SBC.auth.getSession(); user=(s&&s.data&&s.data.session&&s.data.session.user)||null; }catch(_){}
    if(!user){ try{ const u=await SBC.auth.getUser(); user=(u&&u.data&&u.data.user)||null; }catch(_){} }
    if(user){
      const meta=user.user_metadata||{};
      let nm=(meta.name||meta.full_name||(user.email?user.email.split('@')[0]:'나'));
      let av=(meta.avatar_url||meta.picture||''), role='listener', sns={ig:'',yt:'',tt:''}, bio='', vis='public';
      MYFOLLOWS.clear(); MYFOLLOWERS.clear();
      /* 서로 독립적인 5개 쿼리를 병렬로 (기존엔 순차 → 최대 7왕복). 하나 실패해도 나머지는 살린다 */
      const _q=p=>Promise.resolve(p).then(x=>x,()=>null);
      const [pR,fR,fbR,mcR,trR,bkR,rpR]=await Promise.all([
        _q(SBC.from('profiles').select('name,avatar_url,role,sns_instagram,sns_youtube,sns_tiktok,bio,account_visibility').eq('id',user.id).maybeSingle()),
        _q(SBC.from('follows').select('followed_id').eq('follower_id', user.id)),            /* 내가 팔로우 */
        _q(SBC.from('follows').select('follower_id').eq('followed_id', user.id)),            /* 나를 팔로우(맞팔용) */
        _q(followCounts(user.id)),
        _q(SBC.from('track_reactions').select('track_id,kind').eq('user_id', user.id)),
        _q(SBC.from('blocks').select('blocked_id').eq('blocker_id', user.id)),            /* 차단 목록 */
        _q(SBC.from('reports').select('target_kind,target_id').eq('reporter_id', user.id)) /* 내가 낸 신고 */
      ]);
      if(pR&&pR.data){ const d=pR.data; if(d.name&&d.name!=='익명')nm=d.name; if(d.avatar_url)av=d.avatar_url; if(d.role)role=d.role;
        sns={ig:d.sns_instagram||'',yt:d.sns_youtube||'',tt:d.sns_tiktok||''}; bio=d.bio||''; if(d.account_visibility)vis=d.account_visibility; }
      /* 사진이 없으면 비워둔다 — avatarEl 이 이름 첫 글자 아바타로 그린다.
         무작위 인물 사진(i.pravatar.cc)을 넣던 것을 없앴다(initialEl 주석 참고). */
      ME={ id:user.id, name:nm, avatar:av, role:role, email:user.email||'', joined:(user.created_at||'').slice(0,10), sns:sns, bio:bio, vis:vis };
      if(fR&&fR.data) fR.data.forEach(r=>MYFOLLOWS.add(r.followed_id));
      if(fbR&&fbR.data) fbR.data.forEach(r=>MYFOLLOWERS.add(r.follower_id));
      if(mcR) ME.followers=mcR.followers;
      if(trR&&trR.data) trR.data.forEach(x=>{ (MYREACT[x.track_id]=MYREACT[x.track_id]||new Set()).add(x.kind); });   /* track_reactions 없으면 trR=null → 조용히 통과 */
      /* 차단·신고 — safety.sql 미실행이면 null 이라 조용히 통과한다 */
      MYBLOCKS.clear(); MYREPORTS.clear();
      if(bkR&&bkR.data) bkR.data.forEach(function(x){ MYBLOCKS.add(x.blocked_id); });
      if(MYBLOCKS.size) loadBlockedNames().then(function(){ try{render()}catch(_){} });   /* 이름은 나중에 채워도 된다 */
      if(rpR&&rpR.data) rpR.data.forEach(function(x){ MYREPORTS.add(tKey(x.target_kind, x.target_id)); });
      if(bkR===null && rpR===null) SAFETYTABLE=false;
    } else {
      ME=null;
      /* 세션 토큰은 남아 있는데 유저를 못 얻었다 = 만료·무효 → 찌꺼기를 지워야 잠금 화면이 정상적으로 뜬다
         (안 지우면 "불러오는 중" 스플래시에 갇힌다) */
      if(hasStoredSession()){ try{ await SBC.auth.signOut({scope:'local'}); }catch(_){
        try{ for(var i=localStorage.length-1;i>=0;i--){ var k=localStorage.key(i);
          if(k && /^sb-.*-auth-token$/.test(k)) localStorage.removeItem(k); } }catch(__){} } }
    }
  }catch(e){ console.warn('[offlog] loadMe 실패', e); }
  AUTHREADY=true;    /* 로그인 확인 끝 — 이제 !ME면 잠금 화면 */
  return ME;
}

/* 내 페이지 LOG = 내 곡이어야 한다.
   (로더는 '곡이 제일 많은 아티스트'를 me로 삼아 STREAM을 만들기 때문에, 로그인하면 여기서 내 것으로 교체) */
async function loadMyStream(){
  if(!ME||!ME.id||!SBC) return false;
  try{
    const mt=await SBC.from('tracks').select('id,title,audio_url,created_at')
      .eq('artist_id',ME.id).order('created_at',{ascending:false}).limit(60);
    const rows=(mt&&mt.data)?mt.data:[];
    const mine=rows.map(function(x,i){
      const ts=x.created_at||'', dt=ts.slice(0,10), at=ts.slice(11,16);
      return x.audio_url
        ? {id:'sb_'+x.id, t:'snd', at:at, dt:dt, nm:x.title||'무제', dur:'', side:(i%2?'r':'l'), work:null, audio:x.audio_url}
        : {id:'sb_'+x.id, t:'note', at:at, dt:dt, text:x.title||'', tone:(i%2?'b':'y'), side:(i%2?'r':'l'), work:null};
    });
    /* 기기에 저장한 내 로그(my_)는 남기고, 데모 시드는 내 실제 곡으로 교체 */
    const myLocal=STREAM.filter(function(l){ return String(l.id).indexOf('my_')===0; });
    STREAM=_dedupById(myLocal.concat(mine));
    return true;
  }catch(e){ console.warn('[offlog] 내 로그 로드 실패', e); return false; }
}

let _authWired=false;
function wireAuth(){
  if(_authWired||!SBC)return; _authWired=true;
  try{ SBC.auth.onAuthStateChange(function(ev){
    loadMe().then(function(){ return loadMyStream(); }).then(function(){
      try{render();}catch(_){}
      /* 로그인 전에 써둔 로그(sid 없는 my_)를 지금 바로 서버로 올린다.
         부팅 때만 올리면 방금 쓴 글이 다음에 앱을 열 때까지 기기에만 남는다. */
      try{ syncPendingLogs(); }catch(_){}   /* 완료 토스트는 syncPendingLogs 안에서 띄운다 */
    });
  }); }catch(e){}
}
/* OAuth 공통 — signInWithOAuth 는 예외를 던지지 않고 {error} 를 돌려준다.
   try/catch 만 두면 provider 가 꺼져 있을 때 아무 반응 없이 조용히 죽는다(원인 못 찾는 버그). */
async function loginOAuth(provider, label){
  if(!SBC)return;
  try{
    const opts={redirectTo:location.href};
    /* 구글은 한 번 로그인하면 그 뒤로는 계정 선택 없이 같은 계정으로 바로 들어간다.
       우리 앱에서 로그아웃해도 구글 쪽 세션은 남아 있어서, 다른 계정으로 바꿀 수가 없었고
       "로그아웃했는데 또 그 계정으로 로그인된다"로 보였다.
       select_account 를 주면 매번 계정 선택 화면이 뜬다. */
    if(provider==='google') opts.queryParams={prompt:'select_account'};
    const {error}=await SBC.auth.signInWithOAuth({provider:provider, options:opts});
    if(error)throw error;
  }catch(e){
    console.warn('[offlog] '+provider+' 로그인 실패', e);
    offToast(label+' 로그인을 지금 쓸 수 없어요 — 이메일로 로그인해 주세요');
  }
}

/* 회원가입 — 이메일/비밀번호. 가입 직후 profiles 행에 이름을 심는다(없으면 만든다) */
async function signupEmail(email, pw, name){
  if(!SBC)return;
  const btn=document.getElementById('authsubmit'); if(btn){btn.disabled=true;btn.textContent='가입 중…';}
  try{
    if((pw||'').length<6) throw {message:'비밀번호는 6자 이상이어야 해요'};
    const {data,error}=await SBC.auth.signUp({email:email, password:pw, options:{data:{name:name||''}}});
    if(error)throw error;
    const u=data&&data.user;
    /* 이메일 확인이 켜져 있으면 세션이 아직 없다 — 확인 메일 안내로 끝낸다 */
    if(u && !(data.session)){
      S.auth=false; S.authMode='login'; render();
      offToast('확인 메일을 보냈어요 — 메일에서 인증 후 로그인해 주세요');
      return;
    }
    if(u && name){ try{ await SBC.from('profiles').upsert({id:u.id, name:name}, {onConflict:'id'}); }catch(_){ } }
    await loadMe(); S.auth=false; render(); offToast('가입 완료 — 반가워요!');
  }catch(e){
    const m=(e&&e.message)||'';
    offToast(/already|registered|exists/i.test(m) ? '이미 가입된 이메일이에요 — 로그인해 주세요'
           : /6/.test(m)&&/비밀번호/.test(m) ? m
           : /password/i.test(m) ? '비밀번호는 6자 이상이어야 해요'
           : '가입 실패 — '+(m||'다시 시도해 주세요'));
    if(btn){btn.disabled=false;btn.textContent='가입하기';}
  }
}

/* 기기에 저장된 로그인 토큰을 지운다.
   signOut() 은 서버 호출이 실패하면 로컬 세션을 안 지우고 그냥 끝나는 경우가 있다. 그러면
   hasStoredSession() 이 계속 true 라서 렌더 게이트가 잠금화면 대신 스플래시(로딩 스피너)에 머물고,
   사용자에겐 "로그아웃이 안 된다"로 보인다. 그래서 서버 호출 성패와 무관하게 여기서 확실히 지운다. */
function _clearStoredSession(){
  try{ for(var i=localStorage.length-1;i>=0;i--){ var k=localStorage.key(i);
    if(k && /^sb-.*-auth-token/.test(k)) localStorage.removeItem(k); } }catch(_){}
}
/* 계정을 바꿀 때 앞사람 것이 남지 않게 — 차단·신고 목록은 사람마다 다르다.
   loadMe 가 다시 채우지만, 그 사이에 앞사람 기준으로 글이 가려지면 안 된다. */
function _clearUserCaches(){
  MYBLOCKS.clear(); MYREPORTS.clear();
  for(var b in BLOCKEDNAMES) delete BLOCKEDNAMES[b];
  MYPERF=null; MYPERF_UID=null;   /* 내 공연 지원 내역도 계정 전환 시 같이 비운다 */
}

/* 계정 삭제 — 앱스토어 5.1.1(v). 가입할 수 있는 앱은 앱 안에서 계정을 지울 수 있어야 하고,
   '비활성화'가 아니라 데이터가 실제로 지워져야 한다.
   서버의 delete_my_account() 가 본인 데이터를 전부 지운다(supabase/delete-account.sql 실행 필요).
   되돌릴 수 없는 동작이라 두 번 확인한다. */
async function deleteAccount(){
  if(!SBC||!ME) return;
  if(!await offConfirm('계정을 삭제하면 올린 로그·곡·사진이 모두 사라집니다.\n되돌릴 수 없어요. 계속할까요?','계속')) return;
  if(!await offConfirm('정말 삭제할까요?\n이 작업은 취소할 수 없습니다.','삭제')) return;

/* ── 실제 프로필 로드 + 캐시 (공개 읽기) ── */
let PROFCACHE={};
/* 실제 팔로워/팔로잉 수 — follows(follower_id, followed_id) 에서 집계. 못 세면 null(가짜 숫자 금지) */
async function followCounts(id){
  const out={followers:null, following:null};
  if(!id||!SBC) return out;
  try{
    const [a,b]=await Promise.all([   /* 두 count 쿼리 병렬 */
      SBC.from('follows').select('follower_id',{count:'exact',head:true}).eq('followed_id',id),
      SBC.from('follows').select('followed_id',{count:'exact',head:true}).eq('follower_id',id)
    ]);
    if(a && typeof a.count==='number') out.followers=a.count;
    if(b && typeof b.count==='number') out.following=b.count;
  }catch(e){ console.warn('[offlog] followCounts 실패', e); }
  return out;
}
/* 실제 팔로워/팔로잉 목록 — follows + profiles 로 진짜 사람을 가져온다 (목업 PEOPLE 대체) */
const FLCACHE={};   /* key: id|kind → [{id,who,sub,avatar,aid}] */
/* 팔로우/언팔로우하면 목록·수치가 바뀌므로 캐시를 비운다(다음 진입 때 실제 값 재조회) */
function flcacheClear(){ for(var k in FLCACHE) delete FLCACHE[k]; }
async function loadFollowList(id, kind){
  const key=id+'|'+kind;
  if(FLCACHE[key]) return FLCACHE[key];
  if(!id||!SBC) return [];
  try{
    /* follower = 나를 팔로우한 사람 / following = 내가 팔로우한 사람 */
    const whereCol = kind==='follower' ? 'followed_id' : 'follower_id';
    const pickCol  = kind==='follower' ? 'follower_id' : 'followed_id';
    const f=await SBC.from('follows').select(pickCol).eq(whereCol, id).limit(300);
    const ids=[...new Set((f&&f.data?f.data:[]).map(r=>r[pickCol]).filter(Boolean))];
    if(!ids.length){ FLCACHE[key]=[]; return []; }
    const p=await SBC.from('profiles').select('id,name,avatar_url,role').in('id', ids);
    const rows=(p&&p.data?p.data:[]).map(function(x){
      return { id:x.id, aid:x.id, who:x.name||'익명', avatar:x.avatar_url||'', sub:roleKo(x.role)||'', c:'blue' };
    });
    FLCACHE[key]=rows; return rows;
  }catch(e){ console.warn('[offlog] loadFollowList 실패', e); return []; }
}
async function loadProfile(id){
  if(!id||!SBC) return null;
  if(PROFCACHE[id]) return PROFCACHE[id];
  try{
    /* profiles·tracks·followCounts 를 병렬로 → 과거 자료 진입 지연을 4왕복→1왕복 수준으로 */
    const [pr,tr,fc]=await Promise.all([
      SBC.from('profiles').select('id,name,avatar_url,role,sns_instagram,sns_youtube,sns_tiktok').eq('id',id).maybeSingle(),
      SBC.from('tracks').select('id,title,audio_url,cover_url,is_demo,created_at,likes_count,project_id').eq('artist_id',id).order('created_at',{ascending:false}),
      followCounts(id)
    ]);
    const p=pr&&pr.data?pr.data:null;
    const prof={ id:id, name:(p&&p.name)||'아티스트', avatar:(p&&p.avatar_url)||'',
      role:(p&&p.role)||'artist', sns:{ig:(p&&p.sns_instagram)||'',yt:(p&&p.sns_youtube)||'',tt:(p&&p.sns_tiktok)||''},
      followers:fc.followers, following:fc.following,
      tracks:(tr&&tr.data?tr.data:[]).map(function(t){ return {id:t.id, nm:t.title||'무제', audio:t.audio_url||'', cover:(t.cover_url&&/^https?:\/\//.test(t.cover_url))?t.cover_url:'', demo:!!t.is_demo, dt:(t.created_at||'').slice(0,10), likes:t.likes_count||0}; }) };
    PROFCACHE[id]=prof; return prof;
  }catch(e){ console.warn('[offlog] loadProfile 실패', e); return null; }
}
/* 아바타: 실사 이미지 있으면 이미지, 없으면 기존 색 스마일 */
/* 이름 첫 글자 아바타 — 한글 이름이면 성씨 한 글자가 나온다.
   전에는 사진이 없으면 i.pravatar.cc 로 무작위 인물 사진을 붙였는데, 사진을 주지 않는 로그인
   (애플 로그인 등)에서 생판 모르는 사람 얼굴이 내 프로필이 되는 문제가 있어서 없앴다.
   색은 이름에서 계산하므로 같은 사람은 항상 같은 색이다. */
function initialEl(name, size){
  var s=size||44, t=String(name||'').trim();
  var ch=t ? Array.from(t)[0] : '';        /* 이모지·서로게이트쌍까지 한 글자로 */
  if(!ch) return smileEl('blue');
  var h=0; for(var i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))>>>0;
  var hue=h%360;
  return `<span class="avini" style="width:${s}px;height:${s}px;font-size:${Math.round(s*0.42)}px;`
    +`background:hsl(${hue},40%,28%);color:hsl(${hue},72%,80%)">${esc(ch)}</span>`;
}
function avatarEl(av, color, size, name){
  var s=size||44, u=safeUrl(av);   /* url() breakout·속성 이탈 차단: 검증된 URL만 */
  /* background-image 가 아니라 <img> 로 그린다 — 크로미움이 배경이미지의 둥근 클리핑을
     다각형으로 근사해서 원이 팔각형으로 보이는 문제가 있다(글자 아바타는 멀쩡했던 이유).
     overflow:hidden 원 안에 img 를 넣으면 어디서나 진짜 원으로 잘린다. */
  if(u) return `<span class="avimg" style="width:${s}px;height:${s}px"><img src="${u}" alt="" loading="lazy" decoding="async"></span>`;
  if(name) return initialEl(name, s);
  return smileEl(color||'blue');
}

      +'<div class="ocf-btns"><button class="ocf-no">취소</button>'
      +'<button class="ocf-ok">'+esc(okLabel||'확인')+'</button></div></div>';
    function done(v){ try{ bd.remove(); }catch(_){} resolve(v); }

    bd.onclick=function(e){ if(e.target===bd) done(false); };   /* 바깥 탭 = 취소 */
    document.body.appendChild(bd);
  });

/* ── 앱 진단 화면 — 잠금화면 로고를 5번 탭하면 열린다 ──────────────────

/* 배포 표시 — 앱(웹뷰)이 최신 코드를 받았는지 진단 화면에서 바로 확인하려고 둔다.
   ⚠️ 배포할 때마다 이 값을 갱신할 것. 안 그러면 "고쳤는데 안 바뀐다"를 판별할 수 없다. */

/* env(safe-area-inset-*) 의 실제 픽셀값 — 앱에서만 0이 아니다. 재는 방법이 이것뿐이다(JS로 직접 못 읽음) */
function _envInset(side){
  try{
    const p=document.createElement('div');
    p.style.cssText='position:fixed;left:-9999px;top:0;width:1px;height:env(safe-area-inset-'+side+',0px)';
    document.body.appendChild(p);

  }catch(_){ return -1; }
}

      (nv.bottom-window.innerHeight>1?'  ⚠️ 잘림':'  ✅')):'없음'],
    ['screen 여백 위/아래', sc?(sc.paddingTop+' / '+sc.paddingBottom):'없음'],
    ['스크롤', _scr?(_scr.scrollHeight>_scr.clientHeight+1?'가능':'내용이 화면보다 짧음')+
      ' · 잠금 '+(_scr.classList.contains('locked')?'⚠️걸림':'없음'):'없음'],
    ['저장소 / 세션', store+' / '+sess],
    ['플로우', (SBC&&SBC.auth&&SBC.auth.flowType)||'?'],
    ['standalone / 터치', String(navigator.standalone)+' / '+navigator.maxTouchPoints]
  ];
  const el=document.createElement('div');
  el.style.cssText='position:fixed;inset:0;z-index:99999;background:#0c0c0e;color:#eee;padding:22px 18px;'

/* 금칙어 필터 (Guideline 1.2 — 부적절한 콘텐츠를 걸러내는 수단).
   완벽한 차단은 불가능하지만 명백한 욕설·비하는 올라가기 전에 막는다.
   띄어쓰기·문장부호·같은 글자 반복 같은 흔한 우회는 정규화해서 함께 잡는다. */
const BADWORDS=['시발','씨발','ㅅㅂ','병신','ㅂㅅ','좆','새끼','씹','지랄','개새','미친놈','미친년',
  '창녀','걸레','엠창','느금','꺼져','죽어라','tlqkf','fuck','shit','bitch','asshole','cunt','nigger'];
function _normText(s){
  return String(s||'').toLowerCase()
    .replace(/\s+/g,'')
    .replace(/[.,!?~*_\-·…"'`^]/g,'')
    .replace(/(.)\1{1,}/g,'$1');     /* 시발!!! · 씨이이발 같은 반복 축약 */
}
function badWordIn(text){
  if(!text) return '';
  const n=_normText(text);
  for(let i=0;i<BADWORDS.length;i++){
    const w=_normText(BADWORDS[i]);
    if(w && n.indexOf(w)>-1) return BADWORDS[i];
  }
  return '';
}

async function searchProfiles(){
  const q=(S.fq||'').trim();

function studioAdopt(){
  if(!(typeof ME!=='undefined' && ME && ME.id)) return;
  try{
    var legacy=localStorage.getItem(STUDIO_KEY_BASE);
    var anon=localStorage.getItem(STUDIO_KEY_BASE+':anon');
    if(legacy==null && anon==null) return;
    var cur; try{ cur=JSON.parse(localStorage.getItem(studioKey())||'{}'); }catch(_){ cur={}; }
    cur={works:cur.works||[], lists:cur.lists||[], logs:cur.logs||[]};
    [legacy,anon].forEach(function(raw){ if(!raw)return; try{ var s=JSON.parse(raw);
      cur.works=_dedupById(cur.works.concat(s.works||[]));
      cur.lists=_dedupById(cur.lists.concat(s.lists||[]));
      cur.logs =_dedupById(cur.logs.concat(s.logs ||[]));
    }catch(_){}});
    localStorage.setItem(studioKey(), JSON.stringify(cur));
    localStorage.removeItem(STUDIO_KEY_BASE);
    localStorage.removeItem(STUDIO_KEY_BASE+':anon');
  }catch(e){ console.warn('[studio] adopt 실패', e); }
}
function studioSave(){
  try{
    var mineWorks=WORKS.filter(function(w){return w.mine;});
    var myLogs=STREAM.filter(function(l){return l && String(l.id).indexOf('my_')===0 && l.t!=='vid' && !(l.audio&&/^blob:/.test(l.audio));}); /* 영상·미로그인 데모는 blob이라 저장 불가(세션 전용) */
    var myLists=LISTS.filter(function(p){return p.mine;});
    localStorage.setItem(studioKey(), JSON.stringify({works:mineWorks, lists:myLists, logs:myLogs}));
  }catch(e){
    /* 용량 초과 — 예전엔 여기서 저장이 통째로 실패해 로그가 전부 날아갔다.
       이제는 무거운 사진 원본(dataURL)만 버리고 글·구조는 반드시 남긴다.
       (사진은 서버에 올라가 있으면 media URL 로 그대로 다시 보인다) */
    try{
      var slim=(myLogs||[]).map(function(l){
        var o=Object.assign({},l);
        if(o.bg && /url\(\s*["']?data:/.test(o.bg)) o.bg = o.media ? 'center/cover no-repeat url('+o.media+')' : '#141418';
        if(o.audio && /^data:/.test(o.audio)) o.audio = o.media||'';
        return o;
      });
      localStorage.setItem(studioKey(), JSON.stringify({works:mineWorks, lists:myLists, logs:slim}));
      console.warn('[studio] 용량 초과 — 사진 원본은 빼고 저장했습니다', e);
      /* 서버 URL(media)이 있으면 손실이 없다. 없는 것만 실제로 지워지므로 그때만 알린다
         (예전엔 조용히 회색 칸으로 바뀌어서 사용자가 사라진 걸 나중에 알았다) */
      var lost=(myLogs||[]).filter(function(l){
        return (l.bg && String(l.bg).indexOf('data:')>-1 && !l.media)
            || (l.audio && String(l.audio).indexOf('data:')===0 && !l.media);
      }).length;
      if(lost) offToast('저장 공간이 부족해 사진·소리 '+lost+'개가 이 기기에서 지워졌어요 — 로그인하면 서버에 보관됩니다');
      if(!(ME&&SBC)) offToast('사진은 로그인해야 영구 저장돼요');
    }catch(e2){ console.warn('[studio] save 실패', e2); offToast('저장 공간이 부족해요 — 오래된 로그를 정리해 주세요'); }
  }
}
function _dedupById(arr){ var seen={}, out=[]; arr.forEach(function(x){ if(!x)return; var k=x.id; if(k!=null&&seen[k])return; if(k!=null)seen[k]=1; out.push(x); }); return out; }
/* 로더가 만든 샘플 위에 내 저장분을 얹는다 */
function studioMerge(){
  var st=studioLoad();
  if(st.works.length) WORKS=_dedupById(st.works.concat(WORKS));
  if(st.logs.length)  STREAM=_dedupById(st.logs.concat(STREAM));
  if(st.lists.length) LISTS=_dedupById(st.lists.concat(LISTS.filter(function(p){return !p.mine;})));
}

/* ── 로그 영구 저장 (사진·메모·영상) ────────────────────────────────
   전에는 localStorage 에만 저장해서 기기를 바꾸거나 캐시를 지우면 사라졌고,
   사진을 base64 로 넣다가 용량 한도를 넘으면 저장이 통째로 실패했다.
   이제: 사진은 줄여서 Storage 에 올리고, 로그는 logs 테이블에 저장한다.
   (supabase/logs.sql 미실행이면 예전처럼 이 기기에만 저장 — 조용히 폴백) */
let LOGSTABLE=true;    /* logs 테이블 사용 가능 여부 (없으면 false로 내려가고 로컬만) */
let LOGSACT=true;      /* logs.activity 컬럼 가능 여부 (supabase/logs_activity.sql 미실행이면 false로 내려가고 활동태그는 이 기기에만) */
let LOGSDEMO=true;     /* logs.demo_id 컬럼 가능 여부 (supabase/logs-demo-link.sql) — 없으면 담기는 이 기기에만 */

/* 사진을 화면에 충분한 크기로 줄이고 JPEG로 압축 — 원본 base64가 저장을 깨뜨리던 문제 해결 */
function shrinkImage(file, maxPx, quality){
  return new Promise(function(res){
    try{
      const u=URL.createObjectURL(file), img=new Image();
      img.onload=function(){
        const m=maxPx||1280, s=Math.min(1, m/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*s)), h=Math.max(1,Math.round(img.height*s));
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        try{ cv.getContext('2d').drawImage(img,0,0,w,h); res(cv.toDataURL('image/jpeg', quality||0.72)); }
        catch(_){ res(''); }
        try{URL.revokeObjectURL(u)}catch(_){}
      };
      img.onerror=function(){ try{URL.revokeObjectURL(u)}catch(_){} res(''); };
      img.src=u;
    }catch(_){ res(''); }
  });
}
/* dataURL → Blob. 줄인 사진을 올리거나, 저장돼 있던 미리보기를 나중에 다시 보낼 때 쓴다 */
function dataUrlToBlob(d){
  try{
    const m=/^data:([^;]+);base64,(.*)$/.exec(String(d||'')); if(!m) return null;
    const bin=atob(m[2]), a=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
    return new Blob([a], {type:m[1]});
  }catch(_){ return null; }
}
/* 일시적인 통신 실패는 다시 하면 대체로 된다 — 한 번 실패하고 포기하지 않는다.
   크기 초과·권한 문제는 다시 해도 같은 결과라 즉시 포기한다. */
async function retryUp(fn, tries){
  let last;
  for(let i=0;i<(tries||3);i++){
    try{ return await fn(); }
    catch(e){
      last=e;
      const msg=String((e&&e.message)||'')+' '+String((e&&e.statusCode)||'');
      if(/exceed|too large|payload|413|401|403|policy|not allowed|mime/i.test(msg)) throw e;
      await new Promise(function(r){ setTimeout(r, 700*(i+1)); });
    }
  }
  throw last;
}

/* 업로드 크기 상한 — Supabase Storage 버킷 기본 상한이 50MB 라 그 아래로 잡는다.
   넘으면 업로드가 그냥 실패하는데 예전엔 사용자에게 아무 표시가 없어서
   "올렸는데 사진만 없다"가 됐다. 아이폰 영상은 수십~수백 MB 라 특히 자주 걸린다.
   호출부에서 먼저 이걸 확인하고, true 면 업로드를 시도하지 않는다(안내는 여기서 띄운다). */
const MAX_UP={ph:10*1024*1024, vid:45*1024*1024, aud:45*1024*1024};
function tooBigToUpload(file, kind){
  const lim=MAX_UP[kind]||MAX_UP.vid;
  if(!file || file.size<=lim) return false;
  const nm=kind==='ph'?'사진':(kind==='aud'?'음원':'영상');
  offToast(nm+'이 너무 커요 ('+(file.size/1048576).toFixed(1)+'MB) — '+Math.round(lim/1048576)+'MB 이하로 올려주세요');
  return true;
}
/* MP3·WAV만 허용 — accept 속성은 브라우저마다 "모든 파일"로 우회 가능해서 실제 선택 시 한 번 더 막는다.
   WAV의 MIME 타입이 브라우저마다 audio/wav·audio/x-wav·audio/wave 로 갈려서 확장자도 같이 본다 */
function isMp3OrWav(file){
  if(!file) return false;
  const ext=(file.name||'').toLowerCase().split('.').pop();
  if(ext==='mp3'||ext==='wav') return true;
  return /^audio\/(mpeg|mp3|wav|x-wav|wave|vnd\.wave)$/i.test(file.type||'');
}

/* 사진·영상 원본을 Storage에 올리고 공개 URL을 돌려준다 (로그인 필요) */
async function uploadLogMedia(file, kind){
  if(!ME||!SBC||!file) return '';
  try{
    /* 사진은 올리기 전에 줄인다 — 예전엔 원본(아이폰 사진 5MB 내외)을 그대로 올려서
       느린 회선에서 자주 실패했다. shrinkImage 는 화면 표시용에만 쓰이고 있었다. */
    if(kind==='ph'){
      const small=await shrinkImage(file, 1600, 0.82);
      const b=small?dataUrlToBlob(small):null;
      if(b && b.size < file.size) file=new File([b], 'p'+Date.now()+'.jpg', {type:'image/jpeg'});
    }
    const ext=((file.name||'').split('.').pop()||(kind==='vid'?'mp4':'jpg')).toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    const path=ME.id+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.'+ext;
    /* upsert:true — 재시도가 "이미 있다"로 실패하지 않게. 경로에 시각+난수가 있어 충돌 위험은 없다 */
    const up=await retryUp(async function(){
      const r=await SBC.storage.from('log-media').upload(path, file, {contentType:file.type||'application/octet-stream', upsert:true});
      if(r.error) throw r.error;
      return r;
    });
    const pub=SBC.storage.from('log-media').getPublicUrl(path);
    return (pub&&pub.data&&pub.data.publicUrl)||'';
  }catch(e){ console.warn('[offlog] 미디어 업로드 실패(로컬로 유지)', e); return ''; }
}
/* 로그 1건을 서버에 저장. 성공하면 log.sid(서버 id)를 붙인다 */
async function saveLogRemote(log, quiet){
  if(!ME||!SBC||!LOGSTABLE||!log||log.sid) return null;
  try{
    const p={
      author_id:ME.id, kind:log.t, text:log.text||null,
      caption:log.cap||log.nm||null, media_url:log.media||null,
      duration:log.dur||null, tone:log.tone||null,
      visibility:log.vis||'private', work_id:log.work||null
    };
    if(LOGSACT && log.act) p.activity=log.act;   /* 활동 태그 — 컬럼 있으면 함께 저장 */
    const r=await retryUp(async function(){
      const x=await SBC.from('logs').insert(p).select('id').maybeSingle();
      if(x.error) throw x.error;
      return x;
    });
    if(r.data&&r.data.id){ log.sid=r.data.id; try{studioSave()}catch(_){} return r.data.id; }
    return null;
  }catch(e){
    if(e&&(e.code==='PGRST205'||e.code==='42P01')){ LOGSTABLE=false;
      console.info('[offlog] logs 테이블이 없어 이 기기에만 저장됩니다 — supabase/logs.sql 실행 필요'); return null; }
    if(LOGSACT && e && /activity/i.test(String(e.message||''))){ LOGSACT=false;
      console.info('[offlog] logs.activity 컬럼이 없어 활동태그는 이 기기에만 — supabase/logs_activity.sql 실행 필요');
      const l2=Object.assign({},log); delete l2.sid; return saveLogRemote(l2, quiet).then(function(id){ if(id)log.sid=id; return id; }); }
    /* 여기까지 왔으면 재시도(retryUp)도 실패한 것. 로그는 기기에 남아 있고
       syncPendingLogs 가 앱을 열 때·연결이 돌아올 때 자동으로 다시 보낸다.
       quiet = 그 배경 재시도에서 온 호출이므로 토스트를 띄우지 않는다. */
    console.warn('[offlog] 로그 서버 저장 실패', e);
    if(!quiet) offToast('아직 서버에 저장되지 않았어요 — 연결되면 자동으로 다시 올립니다');
    return null;
  }
}
/* 서버에 못 올라간 내 로그를 자동으로 다시 보낸다.
   실패를 안내만 하면 사용자가 직접 다시 올려야 한다 — 앱을 열 때와 연결이 돌아올 때 조용히 재시도한다.
   File 객체는 저장해둘 수 없으므로, 사진은 기기에 남아 있는 미리보기(data:)를 올려서 살린다.
   sid 가 없는 my_ 로그 = 아직 서버에 없는 것. */
let _syncing=false;
async function syncPendingLogs(){
  if(_syncing || !ME || !SBC || !LOGSTABLE) return 0;
  if(navigator.onLine===false) return 0;
  _syncing=true;
  let done=0;
  try{
    const pend=STREAM.filter(function(l){ return l && String(l.id).indexOf('my_')===0 && !l.sid; });
    for(let i=0;i<pend.length;i++){
      const l=pend[i];
      /* 사진이 서버에 없으면 저장된 미리보기를 올려서 다른 기기에서도 보이게 한다 */
      if(!l.media && l.t==='ph'){
        /* bg 에 이미 서버 URL 이 들어있는 경우(예전 구현이 처리하던 케이스)는 그것만 옮긴다 */
        const http=(String(l.bg||'').match(/url\(["']?(https?:[^"')]+)/)||[])[1]||'';
        if(http) l.media=http;
        const d=http?'':(String(l.bg||'').match(/url\(["']?(data:[^"')]+)/)||[])[1]||'';
        const b=d?dataUrlToBlob(d):null;
        if(b){
          const f=new File([b],'r'+Date.now()+'.jpg',{type:b.type||'image/jpeg'});
          const url=await uploadLogMedia(f,'ph');
          if(url){ l.media=url; l.bg='center/cover no-repeat url('+url+')'; }
        }
      }
      if(await saveLogRemote(l, true)) done++;
    }
    if(done){
      try{studioSave()}catch(_){}
      try{render()}catch(_){}
      offToast(done+'개 로그를 서버에 저장했어요');
    }
  }catch(e){ console.warn('[offlog] 보류 로그 동기화 실패', e); }
  finally{ _syncing=false; }
  return done;
}
/* 연결이 돌아오면 바로 다시 시도 */
try{ window.addEventListener('online', function(){ setTimeout(syncPendingLogs, 800); }); }catch(_){}

/* 서버에 저장된 내 로그 → STREAM 아이템으로 */
function _rowToLog(x){
  const ts=x.created_at||'', p=s=>s;
  const base={id:'sv_'+x.id, sid:x.id, at:ts.slice(11,16), dt:ts.slice(0,10),
              vis:x.visibility||'private', side:'l', work:x.work_id||null, act:x.activity||null,
              demoOf:x.demo_id||null};   /* 이 로그가 담긴 데모(logs.id) — 데모의 history */
  if(x.kind==='ph')  return Object.assign(base,{t:'ph',  cap:x.caption||'사진', media:x.media_url||'',
                        bg:x.media_url?('center/cover no-repeat url('+x.media_url+')'):'#141418'});
  if(x.kind==='vid') return Object.assign(base,{t:'vid', cap:x.caption||'', media:x.media_url||'', src:x.media_url||''});
  if(x.kind==='snd') return Object.assign(base,{t:'snd', nm:x.caption||'데모', dur:x.duration||'', media:x.media_url||'', audio:x.media_url||''});
  return Object.assign(base,{t:'note', text:x.text||'', tone:x.tone||'y'});
}
/* 로그인하면 서버의 내 로그를 불러와 합친다 (기기가 바뀌어도 보이게) */
async function loadMyLogs(){
  if(!ME||!SBC||!LOGSTABLE) return false;
  try{
    const cols='id,kind,text,caption,media_url,duration,tone,visibility,work_id,created_at'+(LOGSACT?',activity':'')+(LOGSDEMO?',demo_id':'');
    const r=await SBC.from('logs').select(cols)
      .eq('author_id',ME.id).order('created_at',{ascending:false}).limit(200);
    if(r.error) throw r.error;
    const rows=(r.data||[]).map(_rowToLog);
    if(rows.length){
      const have={}; rows.forEach(function(l){ have[l.sid]=1; });
      const localOnly=STREAM.filter(function(l){ return l && !(l.sid&&have[l.sid]); });
      STREAM=_dedupById(rows.concat(localOnly));
    }
    return true;
  }catch(e){
    if(e&&(e.code==='PGRST205'||e.code==='42P01')){ LOGSTABLE=false; return false; }
    if(LOGSACT && e && /activity/i.test(String(e.message||''))){ LOGSACT=false; return loadMyLogs(); }
    if(LOGSDEMO && e && /demo_id/i.test(String(e.message||''))){ LOGSDEMO=false; return loadMyLogs(); }
    console.warn('[offlog] 내 로그 불러오기 실패', e); return false;
  }
}
/* 이 기기에만 있던 예전 로그를 서버로 한 번 올린다 (유실 방지) */
/* syncPendingLogs 로 합쳤다. 예전 구현은 (1) 사진이 dataURL 뿐이면 포기해서 사진이 사라졌고,
   (2) 부팅 때 한 번만 돌았고, (3) 로그마다 실패 안내가 떠서 여러 개면 토스트가 쏟아졌다.
   지금은 사진을 Storage 로 올려 살리고, 연결이 돌아올 때도 조용히 다시 시도한다. */
async function migrateLocalLogs(){ return syncPendingLogs(); }

/* ── 실제 쓰기 (RLS: 로그인 유저의 JWT로 통과, 익명은 차단) ── */
async function followArtist(aid){

  try{
    const {error}=await SBC.from('follows').insert({follower_id:ME.id, followed_id:aid});
    if(error && error.code!=='23505'){ throw error; }   // 23505=이미 있음 → 무시
    MYFOLLOWS.add(aid); flcacheClear();
    /* 방금 팔로우한 사람의 로그가 바로 피드에 들어오게 — 스로틀 무시하고 즉시 재로드 */
    loadFriendLogs(true).then(function(got){ if(got){ S.feed=buildFeed(); if(S.view==='home'){ try{render();}catch(_){} } } });
    return true;
  }catch(e){ console.warn('[offlog] follow 실패', e); offToast('저장 실패 — 잠시 후 다시'); return false; }
}
async function unfollowArtist(aid){
  if(!aid){ return false; }
  if(!ME){ needLogin(); return false; }
  try{
    const {error}=await SBC.from('follows').delete().eq('follower_id',ME.id).eq('followed_id',aid);
    if(error) throw error;
    MYFOLLOWS.delete(aid); flcacheClear(); return true;
  }catch(e){ console.warn('[offlog] unfollow 실패', e); offToast('저장 실패 — 잠시 후 다시'); return false; }
}
async function toggleReact(tid, kind){
  if(!tid){ return; }
  if(!ME){ needLogin(); return; }
  const set=MYREACT[tid]=MYREACT[tid]||new Set();
  const had=set.has(kind);
  if(had) set.delete(kind); else set.add(kind);   /* 화면은 즉시 반영 */
  try{
    if(had){
      const {error}=await SBC.from('track_reactions').delete().eq('user_id',ME.id).eq('track_id',tid).eq('kind',kind);
      if(error) throw error;
    }else{

    if(e && (e.code==='PGRST205' || e.code==='42P01')) { console.info('[offlog] 반응 저장 보류 — track_reactions 테이블 없음'); return; }
    /* 진짜 실패 → 낙관적 토글 되돌리고 화면 복구(DB와 어긋나지 않게) */
    if(had) set.add(kind); else set.delete(kind);

    console.warn('[offlog] react 실패', e); offToast('반응 저장 실패 — 잠시 후 다시');

}

/* ── LOG 댓글 — 도형 반응 대신 실제 대화(협업)를 남긴다 ──────────────────
   CMTS[logId] = [{id, who, aid, body, at}]  (null=아직 안 불러옴)
   로그 카드마다 "댓글 n" 을 눌러 펼치면 그때 서버에서 가져온다(필요할 때만). */
let CMTS={};
let CMTTABLE=true;      /* log_comments 테이블 사용 가능 여부 — 없으면 조용히 숨긴다 */
let CMTCOUNT={};        /* logId -> 댓글 수 (카드에 바로 표시) */
async function loadComments(logId, force){
  if(!SBC||!CMTTABLE||!logId) return false;
  if(!force && CMTS[logId]) return false;
  try{
    const r=await SBC.from('log_comments').select('id,author_id,body,created_at')
      .eq('log_id',logId).order('created_at',{ascending:true}).limit(100);
    if(r.error) throw r.error;
    const rows=r.data||[];
    const need=[...new Set(rows.map(x=>x.author_id))];
    const names={};
    if(need.length){
      const pr=await SBC.from('profiles').select('id,name,avatar_url').in('id',need);
      (pr.data||[]).forEach(p=>{ names[p.id]={nm:p.name||'익명', av:p.avatar_url||''};
        if(p.name){ AIDBYNAME[p.name]=p.id; if(p.avatar_url) AVBYNAME[p.name]=p.avatar_url; } });
    }
    const p2=x=>String(x).padStart(2,'0');
    CMTS[logId]=rows.map(x=>{ const d=new Date(x.created_at);
      return {id:x.id, aid:x.author_id, who:(names[x.author_id]&&names[x.author_id].nm)||'익명',
              av:(names[x.author_id]&&names[x.author_id].av)||'', body:x.body,
              at:p2(d.getMonth()+1)+'.'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes()),
              mine:!!(ME&&x.author_id===ME.id)}; });
    CMTCOUNT[logId]=CMTS[logId].length;
    return true;
  }catch(e){
    if(e&&(e.code==='PGRST205'||e.code==='42P01')){ CMTTABLE=false; return false; }
    console.warn('[offlog] 댓글 불러오기 실패', e); return false;
  }
}
/* 피드가 새로 만들어질 때마다 그 안의 로그들 댓글 수를 채운다 */
function refreshCmtCounts(){
  const ids=(S.feed||[]).filter(x=>x&&x.src==='flog'&&x.lid).map(x=>x.lid);
  /* 내 로그(서버에 있는 것)도 함께 — 내 페이지에서 답이 몇 개 달렸는지 보여야 한다 */
  (STREAM||[]).forEach(function(l){ if(l&&l.sid) ids.push(l.sid); });

}
async function addComment(logId, body){
  if(!ME) { needLogin(); return false; }
  body=String(body||'').trim();
  if(!body) return false;
  if(badWordIn(body)){ offToast('부적절한 표현이 있어 올릴 수 없어요'); return false; }
  try{
    const r=await SBC.from('log_comments').insert({log_id:logId, author_id:ME.id, body:body}).select('id,created_at').maybeSingle();
    if(r.error) throw r.error;
    const p2=x=>String(x).padStart(2,'0'); const d=new Date((r.data&&r.data.created_at)||Date.now());
    (CMTS[logId]=CMTS[logId]||[]).push({id:(r.data&&r.data.id)||('tmp'+Date.now()), aid:ME.id, who:ME.name||'나',
      av:ME.avatar||'', body:body,
      at:p2(d.getMonth()+1)+'.'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes()), mine:true});
    CMTCOUNT[logId]=CMTS[logId].length;
    return true;
  }catch(e){
    if(e&&(e.code==='PGRST205'||e.code==='42P01')){ CMTTABLE=false; offToast('댓글 기능을 준비 중이에요'); return false; }
    console.warn('[offlog] 댓글 저장 실패', e); offToast('댓글 저장 실패 — 잠시 후 다시'); return false;
  }
}
async function deleteComment(logId, cid){
  if(!ME) return false;
  const arr=CMTS[logId]||[]; const i=arr.findIndex(c=>c.id===cid); if(i<0) return false;
  const bak=arr[i];
  arr.splice(i,1); CMTCOUNT[logId]=arr.length; render();
  try{ const r=await SBC.from('log_comments').delete().eq('id',cid); if(r.error) throw r.error; return true; }
  catch(e){ arr.splice(i,0,bak); CMTCOUNT[logId]=arr.length; render();
    console.warn('[offlog] 댓글 삭제 실패', e); offToast('삭제 실패 — 잠시 후 다시'); return false; }
}
/* 피드에 보이는 로그들의 댓글 수를 한 번에 — 카드마다 "댓글 n"을 정확히 보여주려고 */
async function loadCommentCounts(logIds){
  if(!SBC||!CMTTABLE||!logIds||!logIds.length) return false;
  const need=logIds.filter(id=>id && CMTCOUNT[id]===undefined);
  if(!need.length) return false;
  try{
    const r=await SBC.from('log_comments').select('log_id').in('log_id',need).limit(1000);
    if(r.error) throw r.error;
    need.forEach(id=>{ CMTCOUNT[id]=0; });
    (r.data||[]).forEach(x=>{ CMTCOUNT[x.log_id]=(CMTCOUNT[x.log_id]||0)+1; });
    return true;
  }catch(e){
    if(e&&(e.code==='PGRST205'||e.code==='42P01')) CMTTABLE=false;
    return false;
  }
}

/* ── 내 로그에 달린 새 댓글 알림 ───────────────────────────────────
   알림이 없어서, 누가 내 로그에 댓글을 달아도 그 카드를 다시 열지 않으면 영영 몰랐다.
   협업하라고 만든 기능인데 대화가 시작되질 않는다.
   마지막으로 확인한 시각을 기기에 저장해 두고, 그 뒤에 달린 남의 댓글만 센다. */
let CMTNEW=[];                 /* [{log_id, body, at}] — 아직 안 본 남의 댓글 */
const _CMTSEEN_K='offlog_cmt_seen_v1';
function cmtSeenAt(){ try{ return localStorage.getItem(_CMTSEEN_K)||''; }catch(_){ return ''; } }
function markCmtSeen(){
  try{ localStorage.setItem(_CMTSEEN_K, new Date().toISOString()); }catch(_){}
  CMTNEW=[];
}
async function loadNewComments(){
  if(!ME||!SBC||!CMTTABLE) return false;
  try{
    /* 내 로그 id 목록 — 서버에 있는 것만(sid) */
    const mine=await SBC.from('logs').select('id').eq('author_id',ME.id).limit(500);
    if(mine.error) throw mine.error;
    const ids=(mine.data||[]).map(x=>x.id);
    if(!ids.length){ CMTNEW=[]; return false; }
    let q=SBC.from('log_comments').select('id,log_id,author_id,body,created_at')
      .in('log_id',ids).neq('author_id',ME.id)          /* 내가 쓴 댓글은 알림이 아니다 */
      .order('created_at',{ascending:false}).limit(50);
    const since=cmtSeenAt();
    if(since) q=q.gt('created_at',since);
    const r=await q;
    if(r.error) throw r.error;
    CMTNEW=(r.data||[]).map(x=>({id:x.id, log_id:x.log_id, body:x.body||'', at:x.created_at}));
    return CMTNEW.length>0;
  }catch(e){
    if(e&&(e.code==='PGRST205'||e.code==='42P01')) CMTTABLE=false;
    else console.warn('[offlog] 새 댓글 확인 실패', e);
    return false;
  }
}

function logTs(l){
  if(!l) return 0;
  var id=String(l.id||'');
  if(id.indexOf('my_')===0){ var n=parseInt(id.slice(3),10); if(n) return n; }
  var t=Date.parse(((l.dt||'2000-01-01')+'T'+(l.at||'00:00')));
  return isNaN(t)?0:t;
}
/* 이번 세션에 내가 방금 올린 로그 id — 최신순이라 자연히 맨 위지만,
   시계 오차 등으로 밀리지 않게 핀도 유지한다. */
const SESSION_NEW=new Set();
/* 내 페이지 로그 순서 = 최신순(2026-07-03 요청). 방금 올린 것 핀 → 나머지도 최신부터 */
function streamOrder(arr){
  return arr.slice().sort(function(a,b){
    var pa=SESSION_NEW.has(a.id), pb=SESSION_NEW.has(b.id);
    if(pa&&!pb) return -1;
    if(pb&&!pa) return 1;
    if(pa&&pb)  return logTs(b)-logTs(a);   /* 방금 올린 것끼리는 최신이 위 */
    return logTs(b)-logTs(a);               /* 전부 최신순 — 새로 올린 게 늘 위에 온다 */
  });
}

/* ── 선발 규칙: 절대 득표가 아니라 좌석 수 기준 상위 N팀 ──
   150명 규모에서 '득표 500'은 도달 불가라 아무도 무대를 못 얻는다.
   좌석이 정하는 순위로 바꾼다. 최소 자격선(minVotes) 미만은 순위에서 제외. */
function slotN(r){ return (r&&r.slot)||1; }
function minVotes(r){ return (r&&r.minVotes!=null)?r.minVotes:10; }
function slotLine(r){
  if(!r) return '';
  const n=slotN(r);
  if(r.cat==='music') return '상위 '+n+'곡이 선정됩니다';
  return n===1 ? '1위가 무대를 가져갑니다' : ('상위 '+n+'팀이 무대에 오릅니다');
}
/* 자격선 넘긴 후보만 득표순 정렬 → 순위 배열 */
function ranked(r){
  const mv=minVotes(r);
  return ((r&&r.cands)||[]).filter(c=>(c.v||0)>=mv).sort((a,b)=>(b.v||0)-(a.v||0));
}
/* 이 후보가 선발권 안인가 */
function inSlot(r, cand){
  const rk=ranked(r), i=rk.indexOf(cand);
  return i>=0 && i<slotN(r);
}
/* 내 순위 (자격선 미달이면 null) */
function myRank(r){
  const rk=ranked(r), me=rk.find(c=>c.me);
  return me ? rk.indexOf(me)+1 : null;
}
