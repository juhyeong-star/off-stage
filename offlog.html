/* ── 하이라이트 = "오늘" 만든 것만 ────────────────────────────────────
   예전엔 오래된 발매곡으로 스토리를 만들어서, 몇 달 전 곡이 계속 맨 위에 떠 있었고
   카드에 시각(21:00)만 있어 언제 올린 건지 알 수 없었다.
   이제 최근 24시간 안의 공개 로그만 모으고, 24시간이 지나면 저절로 사라진다. */
const H24=24*60*60*1000;
function _agoKo(ts){
  const t=new Date(ts).getTime(); if(!t) return '';
  const m=Math.floor((Date.now()-t)/60000);
  if(m<1) return '방금';
  if(m<60) return m+'분 전';
  const h=Math.floor(m/60);
  return h+'시간 전';
}
function buildStories(){
  const src=[];
  /* 친구들의 최근 공개 로그 */
  (FRIENDLOGS||[]).forEach(function(x){ if(x&&x.ts) src.push(x); });
  /* 내 로그도 내 하이라이트로 — sid 유무와 무관하게 기기의 것도 포함 */
  (STREAM||[]).forEach(function(l){
    if(!l||!ME) return;
    const ts=l.dt?(l.dt+'T'+(l.at||'00:00')+':00'):null; if(!ts) return;
    src.push({who:ME.name, aid:ME.id, c:'coral', av:ME.avatar||'', ts:ts, t:l.t,
              cap:l.cap||l.nm||l.text||'', bg:l.bg||'', audio:l.audio||''});
  });
  const now=Date.now();
  const fresh=src.filter(function(x){ const t=new Date(x.ts).getTime(); return t && (now-t)<H24 && t<=now+60000; });
  if(!fresh.length) return [];
  fresh.sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  const by={}, order=[];
  fresh.forEach(function(x){
    const k=x.aid||x.who; if(!k) return;
    if(!by[k]){ by[k]={who:x.who, aid:x.aid, c:x.c||colorOfName(x.who), av:x.av||'',
                       following:true, seen:false, items:[]}; order.push(k); }
    if(by[k].items.length<4){
      const cap=x.cap||x.nm||x.text||'';
      by[k].items.push(x.t==='ph'
        ? {t:'ph', at:_agoKo(x.ts), ts:x.ts, cap:cap, bg:x.bg||'#141418'}
        : x.t==='snd' ? {t:'snd', at:_agoKo(x.ts), ts:x.ts, cap:cap||'데모', dur:'', audio:x.audio||''}
        : {t:'note', at:_agoKo(x.ts), ts:x.ts, cap:cap, text:esc(cap)});   /* 뷰어는 note 를 text 로 그린다 */
    }
  });
  return order.map(k=>by[k]).slice(0,10);
}
/* ── 스토리 열 (아웃라인 상단 고정) — 팔로우 중 + 발견 가능한 아티스트 ── */
function storyRow(){
  /* 24시간 안의 것이 있으면 그걸로, 하나도 없으면 하이라이트 줄 자체를 감춘다 */
  const live=buildStories();
  if(live.length) STORIES=live;
  else if(ME) return '';
  return `<div class="avrow">${STORIES.map((s,i)=>{
    /* 차단한 사람의 스토리는 숨긴다. data-story 가 배열 위치를 그대로 쓰므로
       걸러내지 말고 빈 문자열을 돌려 인덱스를 유지한다. */
    if(isHiddenItem(s)) return '';
    const ring = !s.following ? 'discover' : (s.seen ? 'seen' : 'new');
    return `<button class="av ${!s.following?'discover':''}" data-story="${i}" aria-label="${s.who} 스토리 보기">
      <div class="av-ring ${ring}"><div class="av-in" style="background:${c(s.c)}">${s.who[0]}
        ${!s.following?'<span class="av-plus">＋</span>':''}</div></div>
      <small>${s.who}</small></button>`;
  }).join('')}</div>`;
}

/* ── 스토리 뷰어 — 전체화면. 원 하나 = 그 아티스트의 최근 로그 시퀀스 ── */
function storyViewer(){
  if(S.storyIdx===null) return '';
  const s=STORIES[S.storyIdx], it=s.items[S.itemIdx];
  const dur = it.t==='snd' ? 5.2 : 4.2;
  const bars = s.items.map((_,idx)=>{
    const cls = idx<S.itemIdx?'done':idx===S.itemIdx?'active':'';
    return `<div class="svbar ${cls}"><i style="${idx===S.itemIdx?`animation-duration:${dur}s`:''}"></i></div>`;
  }).join('');
  const content =
    it.t==='ph'  ? `<div class="svbg" style="background:${it.bg}"></div><div class="grainy"></div>
                     <div class="svmid"><div class="svcap">${esc(it.cap)}</div></div>`
    : it.t==='snd' ? `<div class="svmid"><div class="svts">${it.at}</div>
                        <div class="svwave">${waveBars(28)}</div><div class="svcap">${esc(it.cap)}</div>
                        <div class="svpill">▶ ${it.dur}</div></div>`
    :               `<div class="svnote ${it.tone==='b'?'b':''}"><p>${it.text}</p></div>`;
  return `<div class="svwrap" id="svwrap">
    <div class="svbars">${bars}</div>
    <div class="svhd">
      <span class="svgo" data-svprof="${s.who}" data-paid="${s.aid||''}">
        ${avatarEl(s.av||avOf(s.who), s.c, 28, s.who)}<b>${s.who}</b></span>
      <span class="tm">${it.at}</span>
      <button class="svmore" data-sharemenu="${it.tid||''}" data-snm="${(it.cap||s.who||'').replace(/"/g,'&quot;')}" data-sby="${(s.who||'').replace(/"/g,'&quot;')}" data-saud="${it.audio||''}" data-said="${s.aid||''}" aria-label="공유·담기·팔로우">⋯</button>
      <button class="svclose" id="svclose" aria-label="닫기">✕</button></div>
    <div class="svbody">${content}
      <button class="svtap l" id="svtapl" aria-label="이전"></button>
      <button class="svtap r" id="svtapr" aria-label="다음"></button></div>
    <div class="svrx">
      <button class="shape rbtn" data-emo="소름" aria-label="소름">${shape('tri',c('green'),24)}</button>
      <button class="shape rbtn" data-emo="루프" aria-label="루프">${shape('circle',c('shpink'),24)}</button>
      <button class="shape rbtn" data-emo="울컥" aria-label="울컥">${shape('diamond',c('blue'),24)}</button>
      <button class="shape rbtn" data-emo="최고" aria-label="최고">${shape('star',c('yellow'),24)}</button>
      <span class="rxn svrxn" data-n="0">0</span></div>
  </div>`;
}

function openStory(i){ S.storyIdx=i; S.itemIdx=0; STORIES[i].seen=true; render(); }
function closeStory(){ S.storyIdx=null; try{AUDIO.pause();}catch(e){} render(); }
function nextItem(){
  const s=STORIES[S.storyIdx];
  if(S.itemIdx<s.items.length-1){ S.itemIdx++; render(); } else { nextStory(); }
}
function prevItem(){
  if(S.itemIdx>0){ S.itemIdx--; render(); } else { prevStory(); }
}
function nextStory(){
  if(S.storyIdx<STORIES.length-1){ openStory(S.storyIdx+1); } else { closeStory(); }
}
function prevStory(){
  if(S.storyIdx>0){ S.storyIdx--; S.itemIdx=0; STORIES[S.storyIdx].seen=true; render(); } else { closeStory(); }
}

/* ── 홈 — 탭 없음. 하나의 알고리즘 피드.
   처음 = Trending. 그 다음부터 Following·Trending·For You가 섞여서 랜덤하게 계속 바뀐다. ── */
/* ── Home — 한 화면에 한 섹션. 좌우 스와이프(또는 상단 칩)로 Logs·Releases·Vote·Following 전환 ── */
/* 홈 3페이지 — 발견(첫 진입) · 무대 · 로그. 첫 화면이 절대 비지 않게 발견을 맨 앞에 둔다 */
const HOMETABS=[['logs','LOG']];/* 홈은 팔로잉 LOG 피드 전용 — 탭 하나뿐이라 탭바 자체가 렌더되지 않는다 */
let HOMEIN=0;   /* 방금 넘어온 방향(+1 다음 / -1 이전) — 새 섹션 입장 애니메이션용 */
let _hgoT=null; /* 섹션 전환 예약 타이머 — 넘어가는 중에 다시 잡으면 취소한다(§3 중단 가능) */
let _lastView='';   /* 직전 뷰 — 뷰 바뀔 때만 전환 페이드 */
let _lastSheet='';  /* 직전에 열려 있던 시트 — 같은 시트가 계속 열려 있으면 슬라이드업 애니메이션을 다시 재생하지 않는다(클릭할 때마다 화면이 튀는 문제) */
let _lastScrollKey='';  /* 스크롤을 맨 위로 리셋할 기준(뷰 + 섹션) */
/* 커버 없을 때 채우는 앨범 느낌 그라데이션 (아티스트 색 기반) */
function relGrad(col){ const h=c(col)||'#3a3a44'; return 'radial-gradient(circle at 30% 25%,'+h+'55,transparent 62%),radial-gradient(circle at 78% 82%,'+h+'33,transparent 58%),#15151b'; }
/* ── 홈 캘린더(날짜 스트립) — 날짜를 탭하면 그날 나 + 맞팔 친구들이 올린 로그만 ── */
function _isoDay(d){ const p=x=>String(x).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function myLogAsFeedItem(l){   /* 내 STREAM 로그 → 피드 카드 모양으로 어댑트 */
  return {src:'me', who:(ME&&ME.name)||'나', c:'coral', aid:(ME&&ME.id)||null,
    t:l.t, at:l.at, dt:l.dt, cap:l.cap||l.nm||l.text, nm:l.nm, text:l.text,
    bg:l.bg, tone:l.tone, dur:l.dur, audio:l.audio, tid:l.tid||null, rx:l.rx||0};
}
function logsOnDate(dateStr){   /* 그날 = 내 로그 + 맞팔 친구 로그 (최신순) */
  const idx=(window.__calIndex&&window.__calIndex())||{};
  const friends=(idx[dateStr]||[]).slice();
  const mine=(typeof STREAM!=='undefined'?STREAM:[]).filter(l=>l.dt===dateStr).map(myLogAsFeedItem);
  return mine.concat(friends).sort((a,b)=>(b.at||'').localeCompare(a.at||''));
}
/* 월별 캘린더(그리드) — SETLOG 스타일. 기본은 얇은 바로 접혀 있고(로그가 바로 보이게),
   탭하면 펼쳐진다. 로그 있는 날엔 점, 오늘/선택 강조 */
function calMonth(){
  const today=new Date(), tIso=_isoDay(today);
  const ym = S.calMonth || tIso.slice(0,7);
  const yy=+ym.slice(0,4), mm=+ym.slice(5,7);
  const sel = S.calDate?' · '+S.calDate.slice(5).replace('-','.'):'';
  /* 접힘 — 얇은 바만. 그리드/인덱스 계산도 안 함(가벼움) */
  if(!S.calOpen){
    return `<div class="calmon">
      <button class="cmbar" data-caltoggle="1"><span class="cmlabel">🗓 ${yy}년 ${mm}월${sel}</span><span class="cmchev">▾</span></button>
      ${S.calDate?`<button class="cmclearbar" data-caldate="">전체 보기 ✕</button>`:''}</div>`;
  }
  /* 펼침 — 달력 그리드 */
  const startDow=new Date(yy, mm-1, 1).getDay();
  const dim=new Date(yy, mm, 0).getDate();
  const idx=(window.__calIndex&&window.__calIndex())||{};
  const have={}; (typeof STREAM!=='undefined'?STREAM:[]).forEach(l=>{ if(l.dt)have[l.dt]=1; });
  Object.keys(idx).forEach(d=>{ if((idx[d]||[]).length)have[d]=1; });
  const WD=['일','월','화','수','목','금','토'];
  let cells='';
  for(let i=0;i<startDow;i++) cells+=`<span class="cmday empty"></span>`;
  for(let d=1;d<=dim;d++){ const di=ym+'-'+String(d).padStart(2,'0');
    const cls=['cmday']; if(di===tIso)cls.push('today'); if(S.calDate===di)cls.push('sel'); if(have[di])cls.push('has');
    cells+=`<button class="${cls.join(' ')}" data-caldate="${di}"><b>${d}</b></button>`; }
  /* 접힘과 동일한 바 구조 — 화살표(▴/▾)가 항상 같은 오른쪽 끝에 있어야 위치가 안 흔들린다.
     달 이동(‹ ›)은 바 아래 줄로 내려 접힘/펼침 사이에 공통 요소만 같은 자리에 남긴다. */
  return `<div class="calmon open">
    <button class="cmbar" data-caltoggle="1"><span class="cmlabel">🗓 ${yy}년 ${mm}월${sel}</span><span class="cmchev">▴</span></button>
    <div class="cmhd"><button class="cmnav" data-calmo="-1" aria-label="이전 달">‹</button>
      <span class="cmhdlab">${yy}. ${String(mm).padStart(2,'0')}</span>
      <button class="cmnav" data-calmo="1" aria-label="다음 달">›</button>
      ${S.calDate?`<button class="cmclear" data-caldate="">전체</button>`:''}</div>
    <div class="cmgrid cmwd">${WD.map((w,i)=>`<span class="cmw${i===0?' sun':i===6?' sat':''}">${w}</span>`).join('')}</div>
    <div class="cmgrid">${cells}</div>
  </div>`;
}
function home(){
  const fing=PEOPLE.filter(p=>p.fing).length;
  const cur=S.homeTab||'logs';

  let bodyC='';
  /* 빈 피드 = 신규 가입자 — 팔로우할 아티스트를 추천해서 피드가 채워질 길을 만든다 (P0-8).
     실제 곡을 올린 아티스트(ALLTRACKS) 중에서 나·이미 팔로우한 사람을 뺀 상위 6명 */
  function recoFollowBlock(){
    loadRecoAuthors();     /* 최근 공개 로그를 쓴 사람들 — 한 번만 불러온다 */
    const mine=a=>(ME&&a.aid===ME.id)||(typeof MYFOLLOWS!=='undefined'&&MYFOLLOWS.has(a.aid));
    /* 1순위: 실제로 로그를 쓰는 사람. 그런 사람이 없을 때만 곡 올린 사람으로 폴백 */
    let rows=(RECOAUTH||[]).filter(a=>!mine(a)).slice(0,6);
    let withPeek=rows.length>0;
    if(!withPeek){
      const seen={}, recos=[];
      (typeof ALLTRACKS!=='undefined'?ALLTRACKS:[]).forEach(t=>{
        const nm=t.by, aid=t.aid;
        if(!nm||!aid||seen[aid])return;
        if(mine({aid}))return;
        seen[aid]=1; recos.push({nm, aid, av:avOf(nm), peek:''});
      });
      rows=recos.slice(0,6);
    }
    if(!rows.length) return `<div class="pknote" style="padding:44px 20px;text-align:center;line-height:1.75">아직 팔로우한 사람의 로그가 없어요.</div>`;
    return `<div class="pknote" style="padding:20px 8px 10px;text-align:center;line-height:1.7">아직 팔로우한 사람의 로그가 없어요.<br>${withPeek?'요즘 기록 중인 사람들이에요':'이 아티스트들부터 팔로우해 보세요'}</div>
      ${rows.map(a=>`<div class="recorow">
        <span class="recoav">${avatarEl(a.av||avOf(a.nm), 'blue', 38, a.nm)}</span>
        <span class="reconm"><b>${esc(a.nm)}</b>${a.peek?`<small>${esc(a.peek)}</small>`:''}</span>
        <button class="fol recofol" data-recofollow="${a.aid}" data-reconm="${esc(a.nm)}">팔로우</button>
      </div>`).join('')}`;
  }
  if(cur==='logs'){
    /* 홈 = 팔로잉 피드 전용 (P0-6/7). 팔로우한 사람들의 공개 로그를 "날짜별로 묶어" 보여준다 —
       오늘/어제/날짜 헤더 아래로 그날 친구들의 활동이 모여, 서로의 리듬이 보인다(동기부여).
       캘린더 날짜를 골랐으면 그날 것만 */
    const list = S.calDate ? logsOnDate(S.calDate) : S.feed;
    const _p2=x=>String(x).padStart(2,'0');
    const _dnow=new Date();
    const _today=_dnow.getFullYear()+'-'+_p2(_dnow.getMonth()+1)+'-'+_p2(_dnow.getDate());
    const _yd=new Date(_dnow.getTime()-864e5);
    const _yday=_yd.getFullYear()+'-'+_p2(_yd.getMonth()+1)+'-'+_p2(_yd.getDate());
    const WD=['일','월','화','수','목','금','토'];
    const dayHead=dt=>{
      const lb = dt===_today?'오늘':dt===_yday?'어제':String(dt).slice(5).replace('-','.');
      let wd=''; try{ wd=WD[new Date(dt+'T00:00:00').getDay()]+'요일'; }catch(_){}
      return `<div class="fdaydiv"><b>${esc(lb)}</b>${wd?`<span>${wd}</span>`:''}</div>`;
    };
    /* ── 같은 시간대는 한 박스로 묶는다 ──────────────────────────────
       14시에 네 명이 올렸으면 카드 네 장이 따로 흩어지는 게 아니라 "14시" 박스 하나에
       모여 보인다. 서로 비슷한 시간에 뭘 하고 있었는지가 한눈에 보여야 동기부여가 된다.
       묶음이 너무 커지면 덩어리가 안 읽히므로 4개까지만 한 박스, 넘치면 다음 박스로. */
    const HOURMAX=4;
    const groups=[];
    list.forEach(function(t){
      const hr=String(t.at||'').slice(0,2);
      const last=groups[groups.length-1];
      if(last && last.dt===t.dt && last.hr===hr && last.items.length<HOURMAX) last.items.push(t);
      else groups.push({dt:t.dt, hr:hr, items:[t]});
    });
    let _lastDt=null;
    bodyC = groups.map(function(g,gi){
      let head='';
      if(g.dt && g.dt!==_lastDt){ _lastDt=g.dt; head=dayHead(g.dt); }
      /* 카드 개별 날짜 칩은 끄고(dt:null) 그룹 헤더로만 날짜를 보여준다 */
      const cards=g.items.map((t,i)=>feedCard(t.dt?{...t, dt:null}:t, gi*10+i)).join('');
      /* 혼자면 굳이 박스로 감싸지 않는다 — 지금까지의 모습 그대로 */
      if(g.items.length<2) return head+cards;
      const hrLab = /^\d\d$/.test(g.hr) ? (+g.hr)+'시' : '';
      return head+`<div class="hgrp">
        <div class="hgrphd"><b>${hrLab}</b><span>${g.items.length}개</span><i></i></div>
        ${cards}</div>`;
    }).join('') || (S.calDate
      ? `<div class="pknote" style="padding:44px 20px;text-align:center;line-height:1.75">이 날은 올라온 로그가 없어요.</div>`
      : recoFollowBlock());
  }
  /* 홈은 팔로잉 LOG 피드 전용 — 무대(투표)/MUSIC(발매 그리드) 분기는 완전히 삭제했다.
     투표는 VOTE 화면(lists), 발매·프로젝트는 My 페이지에서 */

  return `<div class="hd">
    <div class="brand" style="flex:1;text-align:left;font-size:19px;letter-spacing:.02em">OFFLOG</div>
    <button class="circ people" id="gopeople" aria-label="팔로워 · 팔로잉">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <circle cx="9" cy="8" r="3.4"/><path d="M3.2 19.5c0-3.3 2.6-5.6 5.8-5.6s5.8 2.3 5.8 5.6"/>
        <path d="M16.4 5.2a3.4 3.4 0 0 1 0 5.7"/><path d="M18 14.4c2 .7 3.3 2.6 3.3 5.1"/></svg>
      ${fing?`<span class="pdot"></span>`:''}</button></div>
  ${storyRow()}
  ${cmtAlertBar()}
  ${calMonth()}
  <div id="evbnwrap">${eventBanner()}</div>
  ${HOMETABS.length>1?`<div class="hstabs">${HOMETABS.map(t=>`<button class="hstab${cur===t[0]?' on':''}" data-hgoto="${t[0]}">${t[1]}</button>`).join('')}</div>`:''}
  <div id="hswipe">${bodyC}</div>`;
}
/* 내 로그에 새 댓글이 달렸을 때만 뜨는 줄 — 누르면 그 로그로 이동하며 읽음 처리 */

  return `<button class="cmtalert" data-cmtalert="${first.log_id}">
    <span class="cashp">${shape('star', c('yellow'), 20)}</span>

/* 홈에 다시 올 때마다 갱신된다. 버튼 없이, 다녀오면 새 얼굴 */
/* ── 팔로우한 사람들의 "실제 로그"를 피드에 넣는다 ──────────────────────
   버그의 원인: 지금까지 홈 피드는 발매곡(tracks)만 카드로 만들었고 logs 테이블은
   아예 읽지 않았다 — 친구가 로그를 아무리 올려도 피드가 절대 안 변했다. */
let FRIENDLOGS=[];   /* 피드 카드 형태로 변환된 친구 로그 */
let _flogsAt=0;      /* 마지막 로드 시각 — 홈 재진입마다 서버를 두드리지 않게 30초 스로틀 */
const _FCOLS=['coral','blue','green','yellow','purple','shpink'];
function colorOfName(n){ let h=0; n=String(n||''); for(let i=0;i<n.length;i++) h=(h*31+n.charCodeAt(i))|0; return _FCOLS[Math.abs(h)%6]; }
async function loadFriendLogs(force){
  if(!ME||!SBC||!LOGSTABLE||!MYFOLLOWS.size){ FRIENDLOGS=[]; return false; }
  if(!force && Date.now()-_flogsAt<30000) return false;
  _flogsAt=Date.now();
  try{
    const ids=[...MYFOLLOWS];
    const r=await SBC.from('logs')
      .select('id,author_id,kind,text,caption,media_url,duration,tone,created_at')
      .in('author_id',ids).eq('visibility','public')
      .order('created_at',{ascending:false}).limit(80);
    if(r.error) throw r.error;
    const rows=r.data||[];
    /* 작성자 이름·아바타 — profiles에서 한 번에 */
    const need=[...new Set(rows.map(x=>x.author_id))];
    const names={};
    if(need.length){
      const pr=await SBC.from('profiles').select('id,name,avatar_url').in('id',need);
      (pr.data||[]).forEach(p=>{ names[p.id]={nm:p.name||'아티스트', av:p.avatar_url||''};
        if(p.name){ AIDBYNAME[p.name]=p.id; if(p.avatar_url) AVBYNAME[p.name]=p.avatar_url; } });
    }
    const p2=x=>String(x).padStart(2,'0');
    FRIENDLOGS=rows.map(x=>{
      const d=new Date(x.created_at);
      const who=(names[x.author_id]&&names[x.author_id].nm)||'아티스트';
      const base={src:'flog', lid:x.id, who, c:colorOfName(who), aid:x.author_id,
        at:p2(d.getHours())+':'+p2(d.getMinutes()), ts:x.created_at,   /* ts = 24시간 하이라이트 계산용 */
        dt:d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()), rx:0,
        av:(names[x.author_id]&&names[x.author_id].av)||''};
      if(x.kind==='ph')  return {...base, t:'ph', cap:x.caption||'사진',
        bg:x.media_url?('center/cover no-repeat url('+x.media_url+')'):'#141418'};
      if(x.kind==='vid') return {...base, t:'vid', cap:x.caption||'', vsrc:x.media_url||''};
      if(x.kind==='snd') return {...base, t:'snd', nm:x.caption||'데모', dur:x.duration||'', audio:x.media_url||''};
      return {...base, t:'note', text:x.text||'', tone:x.tone||'y'};
    });
    return true;
  }catch(e){
    if(e&&(e.code==='PGRST205'||e.code==='42P01')){ LOGSTABLE=false; }
    else console.warn('[offlog] 친구 로그 로드 실패', e);
    return false;
  }
}
/* ── 추천 팔로우 = "로그를 쓰는 사람" ────────────────────────────────
   예전엔 곡(ALLTRACKS)을 올린 사람을 추천했는데, 그 사람들 대부분은 로그를 안 쓴다.
   추천 6명을 다 팔로우해도 홈이 여전히 비어서 신규 가입자가 그대로 나갔다.
   그래서 '최근 공개 로그를 쓴 사람'을 최신순으로 추천하고, 그 사람의 마지막 로그를
   한 줄 미리보기로 같이 보여준다 — 팔로우하면 뭐가 보이는지 먼저 알 수 있게. */
let RECOAUTH=null;    /* null=아직 안 불러옴, []=불러왔지만 없음 */
async function loadRecoAuthors(){
  if(!SBC || !LOGSTABLE || RECOAUTH!==null) return;
  RECOAUTH=[];        /* 중복 요청 방지 — 실패하면 null로 되돌려 재시도 허용 */
  try{
    const r=await SBC.from('logs')
      .select('author_id,kind,text,caption,created_at')
      .eq('visibility','public').order('created_at',{ascending:false}).limit(120);
    if(r.error) throw r.error;
    const rows=r.data||[], seen={}, picked=[];
    rows.forEach(function(x){
      if(!x.author_id || seen[x.author_id]) return;
      seen[x.author_id]=1;
      const peek = x.kind==='snd' ? '🎵 '+(x.caption||'데모')
                 : x.kind==='ph'  ? '📷 '+(x.caption||'사진')
                 : x.kind==='vid' ? '🎬 '+(x.caption||'영상')
                 : (x.text||x.caption||'');
      picked.push({aid:x.author_id, peek:String(peek).slice(0,40), at:x.created_at});
    });
    if(!picked.length) return;
    const pr=await SBC.from('profiles').select('id,name,avatar_url').in('id',picked.map(p=>p.aid));
    const prof={}; (pr.data||[]).forEach(p=>{ prof[p.id]=p; });
    RECOAUTH=picked.map(function(p){
      const q=prof[p.aid]; if(!q||!q.name) return null;
      return {aid:p.aid, nm:q.name, av:q.avatar_url||'', peek:p.peek, at:p.at};
    }).filter(Boolean);
    /* 첫 화면은 RECOAUTH 가 아직 null 이라 폴백(곡 올린 사람) 목록으로 그려진다.
       여기서 다시 그리지 않으면 데이터가 도착해도 옛 목록이 그대로 남는다. */
    if(RECOAUTH.length && S.view==='home'){ try{render();}catch(_){} }
  }catch(e){
    if(e&&(e.code==='PGRST205'||e.code==='42P01')){ LOGSTABLE=false; return; }
    RECOAUTH=null; console.warn('[offlog] 추천 대상 로드 실패', e);
  }
}
function renewHome(){
  if(window.__resample){ try{ window.__resample(); }catch(e){} }  /* 매번 전체 아티스트에서 새로 샘플 → 트렌드 첫 화면 새 얼굴 */
  S.feed=buildFeed();

/* 스토리 열의 원을 제외한 모든 이름·아바타가 여기로 온다 */
function goProfile(who, aid){
  aid = aid || AIDBYNAME[who] || null;
  if(who==='PEEK' || who==='me' || (ME && (who===ME.name || (aid && aid===ME.id)))){
    S.profile='me'; S.profileAid=(ME&&ME.id)||null;
  } else {
    S.profile=who; S.profileAid=aid;
    if(aid) loadProfile(aid).then(function(p){ if(S.view==='mine' && S.profileAid===aid) render(); });   // 실제 프로필 도착하면 다시 그림
  }
  S.seg='log'; S.flist=null; S.mode='feed'; S.view='mine'; render();
}

/* 알고리즘 — 처음은 Trending, 나머지는 3종 섞어서 무작위 */
function shuffle(a){
  const x=[...a];
  for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}
  return x;
}
function buildFeed(){
  /* 메인 피드 = 서로 맞팔한 친구의 로그만 (TREND/FORYOU/FOLLOW 는 맞팔 풀에서 생성됨).
     합주실(room) 카드는 맞팔이 아닌 아티스트가 섞일 수 있어 메인에서 제외 — 합주실 뷰에서 따로 본다.
     순서 = 최신순(2026-07-03 요청) — 셔플·트렌딩 헤드 대신 dt+at 내림차순. 같은 곡이
     trend/foryou/follow 에 겹치면 정렬 시 나란히 보이므로 중복 1개만 남긴다. */
  const trend  = TREND.map(t=>({src:'trend', ...t}));
  const foryou = FORYOU.map(f=>({src:'foryou', ...f}));
  const follow = FOLLOWLOG.map(f=>({src:'follow', ...f}));
  const seen=new Set();
  const key=x=>String(x.dt||'')+' '+String(x.at||'');
  /* 친구들의 실제 로그(FRIENDLOGS)가 핵심 — 발매곡 카드와 합쳐 최신순 한 줄기로 */
  return [...FRIENDLOGS, ...trend, ...foryou, ...follow]
    .filter(x=>!isHiddenItem(x))   /* 차단한 사람·신고된 콘텐츠는 피드에서 즉시 사라진다 (Guideline 1.2) */
    .filter(x=>{ const k=x.lid||x.tid||((x.who||'')+'|'+(x.nm||x.cap||'')+'|'+(x.at||'')); if(seen.has(k))return false; seen.add(k); return true; })
    .sort((a,b)=>key(b).localeCompare(key(a)));
}

/* Work 스토리 카드와 같은 문법. 안 기울고, 시각이 카드 중앙에 있고, 미디어가 카드를 채운다 */
function feedCard(t,i){
  if(t.src==='room') return roomCard(t.slot);

  /* 이름 옆은 도형이 아니라 프로필 사진(원형) — 없으면 이름 첫 글자. 하이라이트 원과 같은 규칙 */
  const who=`<div class="rwho" data-prof="${esc(t.who)}" data-paid="${t.aid||''}" style="cursor:pointer">${avatarEl(t.av||avOf(t.who), t.c, 24, t.who)}${esc(t.who)}</div>`;
  /* 액션은 ⋯ 하나 — 우측 상단. 친구 로그(flog)는 담기·바 재생 없이 공유/팔로우만 */
  const fol = t.src==='flog'
    ? `<button class="edit mine" data-logmenu="${t.lid||''}" data-lnm="${(t.nm||t.cap||t.text||'').slice(0,40).replace(/"/g,'&quot;')}" data-lby="${(t.who||'').replace(/"/g,'&quot;')}" data-laid="${t.aid||''}" aria-label="공유·팔로우">⋯</button>`
    : `<button class="edit mine" data-sharemenu="${t.tid||''}" data-snm="${(t.nm||t.cap||'').replace(/"/g,'&quot;')}" data-sby="${(t.who||'').replace(/"/g,'&quot;')}" data-saud="${t.audio||''}" data-said="${t.aid||''}" aria-label="공유·담기·팔로우">⋯</button>`;
  /* 반응 도형 → 댓글로 교체(협업). 로그(flog)만 댓글 가능 — 발매곡 카드는 대상 로그가 없다.
     아이콘은 기존 도형 언어를 그대로 이어간다 — 로그 종류마다 다른 도형·색(메모=별, 사진=원,
     데모=삼각, 영상=다이아). 말풍선 대신 이 앱의 vibe를 유지 */
  const _cid=t.lid||'';
  const _cn=(_cid&&CMTCOUNT[_cid])||0;
  const _CSH={note:['star','yellow'], ph:['circle','shpink'], snd:['tri','green'], vid:['diamond','blue']};
  const _cs=_CSH[t.t]||_CSH.note;
  /* '댓글' 글자 없이 도형 표시만 — 있으면 개수, 없으면 도형 하나. 접근성 라벨로만 의미를 남긴다 */
  const rx = (t.src==='flog' && _cid)
    ? `<button class="fcmt${_cn?'':' bare'}" data-cmt="${_cid}" aria-label="댓글 ${_cn}개">
         ${shape(_cs[0], c(_cs[1]), 17)}${_cn?`<b>${_cn}</b>`:''}</button>`
    : '';
  const dtb = t.dt?`<div class="fdt">${esc(String(t.dt).slice(5).replace('-','.'))}</div>`:'';

  /* 카드를 눌러도 전체화면(슬라이드) 팝업이 뜨지 않는다 — 홈에서는 data-slide 를 붙이지 않는다.
     사진/글은 그 자리에 그대로 있고, 음원은 카드 안에서 재생, 대화는 댓글 패널로. */
  const body =
    t.t==='ph'  ? `<div class="rcard">
        <div class="bgimg" style="background:${t.bg}"></div><div class="grainy"></div>
        <div class="rmid"><div class="rts">${t.at}</div><div class="rcap">${esc(t.cap)}</div></div>${who}${fol}${rx}</div>`
  : t.t==='snd' ? `<div class="rcard snd" data-play${t.audio?` data-audio="${t.audio}"`:''}>
        <div class="bigwv">${waveBars(34)}</div>
        <div class="rmid"><div class="rts">${t.at||''}</div><div class="rcap">${t.nm||t.cap}</div>
          <span class="sndpill"><em>▶</em><b>${t.dur||''}</b></span></div>${who}${fol}${rx}</div>`
  : t.t==='vid' ? `<div class="rcard" style="overflow:hidden">
        <video src="${t.vsrc||''}" controls playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>
        <div class="rmid" style="pointer-events:none"><div class="rts">${t.at||''}</div>${t.cap?`<div class="rcap">${esc(t.cap)}</div>`:''}</div>${who}${fol}${rx}</div>`
  :               `<div class="rcard paper ${t.tone==='b'?'b':''}">
        <div class="rmid"><div class="rts">${t.at}</div><div class="rnote">${esc(t.text)}</div></div>${who}${fol}${rx}</div>`;

  return `<div class="fcard">${dtb}${body}${cmtPanel(_cid)}</div>`;
}
/* 댓글 패널 — 카드 아래로 펼쳐진다(S.cmtOpen 인 로그만) */
function cmtPanel(logId){
  if(!logId || S.cmtOpen!==logId) return '';
  const list=CMTS[logId];
  const rows = list===undefined
    ? `<div class="cmtnote">불러오는 중…</div>`
    : (!list.length ? `<div class="cmtnote">첫 댓글을 남겨보세요</div>`
      : list.map(c=>`<div class="cmtrow">
          <b class="cmtwho" data-prof="${esc(c.who)}" data-paid="${c.aid||''}">${esc(c.who)}</b>
          <span class="cmtbody">${esc(c.body)}</span>
          <span class="cmtat">${esc(c.at)}</span>
          ${c.mine?`<button class="cmtdel" data-cmtdel="${c.id}" data-cmtlog="${logId}" aria-label="댓글 삭제">✕</button>`:''}
        </div>`).join(''));
  return `<div class="cmtpanel">
    ${rows}
    <div class="cmtform">
      <input class="cmtin" id="cmtin-${logId}" placeholder="${ME?'댓글 남기기…':'로그인하면 댓글을 쓸 수 있어요'}" ${ME?'':'disabled'}>
      <button class="cmtsend" data-cmtsend="${logId}" ${ME?'':'disabled'}>등록</button>
    </div>
  </div>`;
}

/* ── 슬라이드 뷰 — 같은 피드, 한 화면에 하나씩. 위아래로 넘긴다 ── */
function slideView(){
  const sl=(t,i)=>{
    const anchor=` id="sl${i}"`;
    const who=`<div class="slwho"><span data-prof="${esc(t.who)}" data-paid="${t.aid||''}" style="cursor:pointer;display:flex;align-items:center;gap:8px">${dot(t.c)}${t.who||''}</span></div>`;
    /* ⋯ 는 하나로 — 우측 상단 ✕ 옆. 공유·담기·팔로우를 다 담는다 */
    const moreBtn=`<button class="sldots" data-sharemenu="${t.tid||''}" data-snm="${(t.nm||t.cap||'').replace(/"/g,'&quot;')}" data-sby="${(t.who||'').replace(/"/g,'&quot;')}" data-saud="${t.audio||''}" data-said="${t.aid||''}" aria-label="공유·담기·팔로우">⋯</button>`;
    /* ✕ 는 슬라이드마다 넣는다. 예전엔 스크롤되는 바깥(.slwrap)에 하나만 있어서
       슬라이드를 넘기면 ✕ 가 같이 스크롤돼 사라졌다(닫을 방법이 없어짐). */
    const closeBtn=`<button class="slx" aria-label="닫기">✕</button>`;
    const _smine=(t.tid && MYREACT[t.tid])||null;
    const _srb=(emo,sh,col)=>`<button class="shape rbtn${_smine&&_smine.has(emo)?' hit':''}" data-emo="${emo}"${_smine&&_smine.has(emo)?' data-hit="1"':''} aria-label="${emo}">${shape(sh,c(col),26)}</button>`;
    const rx=`<div class="slrx" data-tid="${t.tid||''}">
      ${_srb('소름','tri','green')}
      ${_srb('루프','circle','shpink')}
      ${_srb('울컥','diamond','blue')}
      ${_srb('최고','star','yellow')}
      <span class="rxn" data-n="${t.rx||0}">${t.rx||0}</span></div>`;
    const hint=i===0?`<span class="slhint">⌄</span>`:'';

    if(t.src==='room'){
      const rows=ROOM[t.slot];
      const mini=r=>{
        if(r.t==='empty') return `<div class="rm empty"><span class="rmw">${esc(r.who)}</span><span class="rmts">${t.slot}</span></div>`;
        if(r.t==='ph')  return `<div class="rm" style="background:${r.bg}"><span class="rmw">${esc(r.who)}</span><span class="rmts on">${t.slot}</span></div>`;
        if(r.t==='snd') return `<div class="rm snd"><div class="rmwv">${waveBars(12)}</div><span class="rmw">${esc(r.who)}</span><span class="rmts on">${t.slot}</span></div>`;
        return `<div class="rm paper"><span class="rmw" style="color:${c('ink')}">${esc(r.who)}</span><span class="rmnote">${esc(r.text)}</span></div>`;
      };
      return `<div class="sl"${anchor} data-room="${t.slot}">
        <div class="slwho"><b style="font-family:'Black Han Sans';font-size:17px">${t.slot}</b>
          <span style="font-size:11px;color:rgba(255,255,255,.6);font-weight:400">${rows.filter(r=>r.t!=='empty').length}/${rows.length}명</span></div>
        <div class="slroom">${rows.map(mini).join('')}</div>${hint}</div>`;
    }
    if(t.t==='ph') return `<div class="sl"${anchor}>
      <div class="bgimg" style="background:${t.bg}"></div><div class="grainy"></div>
      ${who}${moreBtn}${closeBtn}<div class="slmid"><div class="slts">${t.at}</div><div class="slcap">${esc(t.cap)}</div>${rx}</div>${hint}</div>`;
    if(t.t==='snd') return `<div class="sl snd"${anchor} data-slplay>
      ${who}${moreBtn}${closeBtn}
      <div class="slmid">
        <div class="slts">${t.at||''}</div>
        <div class="slcap">${t.nm||t.cap}</div>
        <div class="slwave">${waveBars(30)}</div>${rx}</div>${hint}</div>`;
    return `<div class="sl paper ${t.tone==='b'?'b':''}"${anchor}>

/* ── 무대·발매에 낸 로그는 무조건 공개 (계정이 비공개여도) ──
   투표자가 음악만 듣고 판단하지 않도록, 밖으로 내보내는 '명시적 행동'이 담장을 넘긴다. */
async function publishLogs(ids){
  if(!ids||!ids.length) return 0;
  /* 로컬 먼저 무조건 공개로 — 서버에 아직 없는 로그(sid 없음)도 빠지지 않게 (요청 8) */
  let n=0;
  ids.forEach(function(id){ const l=STREAM.find(x=>x.id===id); if(l&&l.vis!=='public'){ l.vis='public'; n++; } });
  try{studioSave()}catch(_){}
  const sids=ids.map(function(id){ const l=STREAM.find(x=>x.id===id); return l&&l.sid; }).filter(Boolean);
  if(ME&&SBC&&LOGSTABLE&&sids.length){
    try{ const r=await SBC.from('logs').update({visibility:'public'}).in('id', sids); if(r.error)throw r.error; }
    /* 화면엔 공개로 보이는데 서버는 비공개 → 무대·투표에서 안 보일 수 있으므로 반드시 알린다 */
    catch(e){ console.warn('[offlog] 로그 공개 전환 실패(서버) — 로컬은 공개됨', e);
      offToast('로그 공개가 서버에 반영되지 않았어요 — 연결 확인 후 다시 시도해 주세요'); }
  }
  return n;
}
/* 이 로그의 공개를 잠가야 하나 — 무대·발매에 '제출된' 곡에 담긴 로그만 (작업 중 곡은 자유) */
function logVisLocked(l){
  if(!l||!l.work) return false;
  const w=(typeof WORKS!=='undefined'?WORKS:[]).find(x=>x&&x.id===l.work);
  return !!(w&&(w.pending||w.event));
}
/* ── 📊 로그 활동 분석표 (요청 10) — 내 로그(로컬+서버 병합)에서 즉석 계산 ── */
function logStatsSheet(){
  const L=(typeof STREAM!=='undefined'?STREAM:[]).filter(l=>l&&logTs(l)>0);
  const now=Date.now(), D=864e5;
  const in30L=L.filter(l=>now-logTs(l)<30*D);
  const in7=L.filter(l=>now-logTs(l)<7*D).length, in30=in30L.length;
  /* 연속 기록 — 오늘(아직 안 썼으면 어제)부터 거꾸로 하루라도 로그가 있으면 이어짐 */
  const days=new Set(L.map(l=>l.dt).filter(Boolean));
  const iso=x=>{const p=n=>String(n).padStart(2,'0');return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate());};
  let streak=0, sd=new Date();
  if(!days.has(iso(sd))) sd.setDate(sd.getDate()-1);
  while(days.has(iso(sd))){ streak++; sd.setDate(sd.getDate()-1); }
  const ACT=[['prac','연습','var(--mint)'],['show','공연','var(--pink)'],['work','작업','var(--blue)'],['etc','기타','var(--yellow)'],[null,'미분류','#5a5a62']];
  const actCnt=ACT.map(a=>in30L.filter(l=>(l.act||null)===a[0]).length);
  const actMax=Math.max.apply(null,actCnt.concat([1]));
  const KND=[['note','✎ 글'],['ph','📷 사진'],['vid','🎬 영상'],['snd','♪ 데모']];
  const kndCnt=KND.map(k=>in30L.filter(l=>l.t===k[0]).length);
  const kndMax=Math.max.apply(null,kndCnt.concat([1]));
  const wk=[]; for(let i=7;i>=0;i--){ const a=now-(i+1)*7*D, b=now-i*7*D; wk.push(L.filter(l=>{const t=logTs(l);return t>a&&t<=b;}).length); }
  const wkMax=Math.max.apply(null,wk.concat([1]));
  const bar=(lab,cnt,max,col)=>`<div class="stbrow"><span class="stblab">${lab}</span><span class="stbtrack"><i style="width:${Math.round(cnt/max*100)}%;background:${col||'var(--mint)'}"></i></span><b class="stbnum">${cnt}</b></div>`;
  return `<div class="sheet-bd" id="lsbd"></div>
  <div class="pksheet tall">
    <div class="pkhd"><b>📊 활동 분석</b><span class="pksub">최근 30일 기준</span><button class="pkx" id="lsclose" aria-label="닫기">✕</button></div>
    <div class="stsum">
      <div class="stcell"><b>${in7}</b><small>이번 주</small></div>
      <div class="stcell"><b>${in30}</b><small>30일</small></div>
      <div class="stcell"><b>${streak}<em>일</em></b><small>연속 기록</small></div>
      <div class="stcell"><b>${L.length}</b><small>전체</small></div>
    </div>
    <div class="rsec">활동별</div>
    ${ACT.map((a,i)=>bar(a[1],actCnt[i],actMax,a[2])).join('')}
    <div class="rsec">종류별</div>
    ${KND.map((k,i)=>bar(k[1],kndCnt[i],kndMax)).join('')}
    <div class="rsec">주별 추이 <em class="opt">최근 8주</em></div>
    <div class="stwk">${wk.map(c=>`<span class="stwb"><i style="height:${Math.max(6,Math.round(c/wkMax*100))}%"></i><small>${c}</small></span>`).join('')}</div>
    <p class="rulen" style="text-align:left;margin:10px 4px 0">로그 올릴 때 연습·공연·작업·기타 태그를 고르면 여기에 분류돼요</p>
  </div>`;
}

  const s=String(seed==null?col:seed);

};

  /* 녹음 = 즉석. 음원 = 믹스다운 파일 업로드 (Demo 탭이 하던 일) */

    const w = l.work ? WORKS.find(x=>x.id===l.work) : null;

    const _rb=(emo,sh,col)=>`<button class="shape rbtn${_mine&&_mine.has(emo)?' hit':''}" data-emo="${emo}"${l.tid?` data-tid="${l.tid}"`:''} aria-label="${emo}">${shape(sh,c(col),22)}</button>`;
    const rx = `<div class="frx" data-tid="${l.tid||''}">${_rb('소름','tri','green')}${_rb('루프','circle','shpink')}${_rb('울컥','diamond','blue')}${_rb('최고','star','yellow')}<span class="rxn" data-n="${l.rx||0}">${l.rx||0}</span></div>`;
    /* 업로드 날짜 라벨 — 카드 위 gap에 (예: 07.20) */

    /* 공개/비공개 칩 — 카드 위에 항상 보이는 토글(⋯ 메뉴에 숨어 있으면 못 찾는다).

    const _mn=(_mc&&CMTCOUNT[_mc])||0;
    const _MSH={note:['star','yellow'], ph:['circle','shpink'], snd:['tri','green'], vid:['diamond','blue']};

    const cmtBtn = _mc ? `<button class="fcmt${_mn?'':' bare'}" data-cmt="${_mc}" aria-label="댓글 ${_mn}개">

    const cp = _mc ? cmtPanel(_mc) : '';   /* 댓글 패널 — 펼친 로그만 실제로 그려진다 */

      <div class="bgimg" style="background:${l.bg}"></div><div class="grainy"></div>
      <div class="rmid"><div class="rts">${l.at}</div><div class="rcap">${esc(l.cap)}</div></div>${who}${rx}${chrome}</div>${cp}</div>`;
    if(l.t==='snd') return `<div class="fcard my">${dtb}<div class="rcard snd" data-play${l.audio?` data-audio="${l.audio}"`:''}>

      <div class="rmid"><div class="rts">${l.at}</div><div class="rcap">${esc(l.nm)}</div>

    if(l.t==='vid') return `<div class="fcard my">${dtb}<div class="rcard" style="overflow:hidden">
      <video src="${l.src}" controls playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>
      <div class="rmid" style="pointer-events:none"><div class="rts">${l.at}</div>${l.cap?`<div class="rcap">${esc(l.cap)}</div>`:''}</div>${who}${rx}${chrome}</div>${cp}</div>`;
    const tc = l.tone==='b'?'b':l.tone==='p'?'p':'';   /* 포스트잇 색: 노랑/하늘/핑크 */
    return `<div class="fcard my">${dtb}<div class="rcard paper ${tc}">
      <div class="rmid"><div class="rts">${l.at}</div><div class="rnote">${esc(l.text)}</div></div>${who}${rx}${chrome}</div>${cp}</div>`;
  };

  /* 공개/비공개 토글이 있던 시절에 쌓인 비공개 로그들 — 카드마다 칩을 눌러 바꾸려면 너무 번거로워
     친구 피드에 영영 안 나타난다. 몇 개인지 알려주고 한 번에 공개로 돌릴 길을 준다. */

    ? `<button class="privbar" id="puball">
         <span class="pbtx"><b>비공개 로그 ${_priv.length}개</b><small>친구 피드에 안 보이고 있어요</small></span>
         <span class="pbgo">한 번에 공개</span></button>`
    : '';

  /* 맨 위의 큰 '＋ 로그 남기기' 박스는 없앴다 — 화면 첫 칸을 빈 버튼이 차지해서
     정작 내 콘텐츠가 아래로 밀렸다. 작성은 하단 ＋ 버튼으로 통일. */
  const logs=`
    ${privBar}
    ${me?`<button class="statsbtn" id="logstats">📊 활동 분석<span>연습 · 공연 · 작업 기록 한눈에</span></button>`:''}
    <div class="stream" id="stream"><div class="ambient"></div>
      <div class="marks">${streamOrder(STREAM).map(mark).join('')||`<div class="pknote" style="padding:26px 0">아직 로그가 없어요</div>`}</div></div>`;

  return `<div class="hd">
    <button class="circ" data-v="home" aria-label="뒤로"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg></button>
    <div class="htitle">${me?'':esc(prof.who)}<small>${me?'내 페이지':prof.sub}</small></div>
    <div class="r">${me&&ME
      ? `<button class="circ" id="mysettings" aria-label="메뉴">⋯</button>`
      : `<button class="circ" aria-label="공유">⤴</button>`}</div></div>
  <div class="mprof">${me&&ME
      ? `<button class="mpav avedit" id="acavbtn" aria-label="프로필 사진 바꾸기">${avatarEl(prof.avatar, prof.c, 92, prof.who||prof.name)}<span class="avcam">📷</span></button><input type="file" id="acavfile" accept="image/*" hidden>`
      : `<span class="mpav">${avatarEl(prof.avatar, prof.c, 92, prof.who||prof.name)}</span>`}
    <h3>${esc(prof.who)}</h3><p>${esc(prof.sub)}</p>
    <div class="fcount">
      <button class="fc" data-flist="follower"><b>${me?((ME&&ME.followers!=null)?ME.followers:'—'):((rp&&rp.followers!=null)?rp.followers:'—')}</b><small>팔로워</small></button>
      <span class="fcdiv"></span>
      <button class="fc" data-flist="following"><b>${me?MYFOLLOWS.size:((rp&&rp.following!=null)?rp.following:'—')}</b><small>팔로잉</small></button></div>
    ${me
      ? (ME?`<button class="acedit" id="acedit">프로필 수정</button>`:`<button class="fol profol" id="profloginbtn">로그인</button>`)
      : `<button class="fol profol ${following?'on':''}" id="profolbtn" data-aid="${S.profileAid||''}">${following?'팔로잉':'팔로우'}</button>
         <!-- 앱스토어 Guideline 1.2 — 콘텐츠뿐 아니라 사용자 자체도 신고·차단할 수 있어야 한다 -->
         <button class="promore" id="promore" aria-label="공유 등 더보기">⋯</button>`}</div>
  ${me&&needsRealName()?`<button class="namehint" id="fixname">이름이 <b>${esc(ME.name)}</b> 로 되어 있어요 · 활동명으로 바꾸기</button>`:''}
  ${me?`<button class="myplrow" data-v="lists">🎵 내 플레이리스트<span>›</span></button>`:''}
  <div class="seg profseg">

/* 곡이 로그를 부른다. 로그가 곡을 고르는 게 아니라.
   미분류 로그를 한 번에 여러 개 골라 담는다 — 창작이 끝난 뒤 돌아보는 순서 */
function logPuller(w){
  const free=STREAM.filter(l=>!l.work);
  const pv=l=>
      l.t==='note' ? `<span class="plth paper">✎</span>`
    : l.t==='ph'   ? `<span class="plth" style="background:${l.bg}"></span>`
    :                `<span class="plth snd">♪</span>`;
  const nm=l=> l.t==='note' ? l.text.replace(/\n.*/,'') : l.t==='ph' ? l.cap : l.nm;
  return `<div class="sheet-bd" id="plbd"></div>
  <div class="pksheet">
    <div class="pkhd"><b>${esc(w.nm)}에 담을 로그</b>
      <button class="pkx" id="plclose" aria-label="닫기">✕</button></div>
    <div class="pkwarn" style="background:rgba(83,224,200,.07);border-color:rgba(83,224,200,.25);color:var(--mint)">
      작업 기간 <b>${w.span}</b> 안의 아직 어느 작품도 아닌 로그입니다</div>
    ${free.length?free.map(l=>`<button class="pkrow plrow ${S.sel.includes(l.id)?'on':''}" data-sel="${l.id}">
      <span class="plck"></span>${pv(l)}
      <span class="pknm"><b>${nm(l)}</b><small>${l.at}${l.dur?' · '+l.dur:''}</small></span></button>`).join('')
      : `<div class="pknote" style="padding:20px 0">담을 로그가 없습니다</div>`}
    <button class="cta" id="pulldone" ${S.sel.length?'':'disabled'}>
      ${S.sel.length?S.sel.length+'개 담기':'로그를 고르세요'}</button>
  </div>`;
}

/* 발매용 로그 큐레이션 — 내 전체 로그를 날짜별로 묶어 골라 담는다 (날짜 자동 그룹핑) */
/* 발매용 로그 선택 행 — 발매 시트와 별도 피커가 공유 (STREAM 을 날짜별로 묶어 data-sel 토글 버튼으로) */
function relLogRows(){
  const pv=l=>
      l.t==='note' ? `<span class="plth paper">✎</span>`
    : l.t==='ph'   ? `<span class="plth" style="background:${l.bg||'#141418'}"></span>`
    : l.t==='vid'  ? `<span class="plth snd">▷</span>`
    :                `<span class="plth snd">♪</span>`;
  const nm=l=> l.t==='note' ? (l.text||'').replace(/\n[\s\S]*/,'') : (l.nm||l.cap||'로그');
  const all=STREAM.slice();
  if(!all.length) return `<div class="pknote" style="padding:20px 0">아직 로그가 없어요 · 마이에서 ＋로 로그를 남겨보세요</div>`;
  const byDt={}; all.forEach(l=>{ const d=l.dt||'zzz'; (byDt[d]=byDt[d]||[]).push(l); });
  return Object.keys(byDt).sort().reverse().map(d=>{
    const label=(d==='zzz')?'날짜 미상':d.replace(/-/g,'.');
    return `<div class="pldate">${label}</div>${byDt[d].map(l=>`<button class="pkrow plrow ${S.sel.includes(l.id)?'on':''}" data-sel="${l.id}">
      <span class="plck"></span>${pv(l)}
      <span class="pknm"><b>${esc(nm(l))}</b><small>${l.at||''}${l.dur?' · '+l.dur:''}</small></span></button>`).join('')}`;
  }).join('');
}
function releaseLogPicker(w){
  const body = relLogRows();
  return `<div class="sheet-bd" id="rpkbd"></div>
  <div class="pksheet tall">
    <div class="pkhd"><b>${esc(w.nm)} 발매 로그</b>
      <button class="pkx" id="rpkclose" aria-label="닫기">✕</button></div>
    <div class="pkwarn" style="background:rgba(83,224,200,.07);border-color:rgba(83,224,200,.25);color:var(--mint)">
      전체 로그에서 이 발매에 넣을 것을 고르세요 · 날짜별로 자동 정리됩니다</div>
    ${body}
    <button class="cta" id="rpkdone">${S.sel.length?S.sel.length+'개 담기':'담기'}</button>
  </div>`;
}

/* 프로필 부분 갱신 공통 — update 를 먼저 시도하고, 행이 없을 때만 insert 로 만든다.
   upsert(POST + merge-duplicates)는 profiles.name NOT NULL 때문에 부분 컬럼만 보내면
   23502 로 실패한다(ON CONFLICT 전에 INSERT 튜플을 검증하므로 기존 행이 있어도 동일). */
async function _profileSave(patch){
  if(!ME||!SBC) return {error:{message:'no session'}};
  const up=await SBC.from('profiles').update(patch).eq('id',ME.id).select('id');
  if(up.error) return up;
  if(up.data && up.data.length) return up;          /* 갱신됨 */
  /* 아직 프로필 행이 없다 → name 을 채워 새로 만든다(NOT NULL 충족) */
  const row=Object.assign({id:ME.id, name:(ME.name||'아티스트')}, patch);
  return await SBC.from('profiles').insert(row);
}
/* 프로필 사진 변경 — Storage(log-media)에 올리고 profiles.avatar_url 갱신 */
async function saveAvatar(file){
  if(!ME||!SBC||!file){ needLogin(); return; }
  if(tooBigToUpload(file,'ph')) return;
  offToast('사진 올리는 중…');
  try{
    const url=await uploadLogMedia(file,'ph');
    if(!url) throw new Error('업로드 실패');
    /* upsert 를 쓰면 안 된다 — profiles.name 이 NOT NULL 이라 Postgres 가 ON CONFLICT 이전에
       INSERT 튜플을 검증하면서 23502(name null)로 실패한다(행이 이미 있어도). 부분 갱신은 update. */
    const r=await _profileSave({avatar_url:url}); if(r.error)throw r.error;
    ME.avatar=url; try{ AVBYNAME[ME.name]=url; }catch(_){}
    render(); offToast('프로필 사진을 바꿨어요');
  }catch(e){ console.warn('[offlog] 아바타 변경 실패', e); offToast('사진 변경 실패 — 잠시 후 다시'); }
}

/* 목록 본문만 만든다 — 전체 화면(flist)과 검색 중 부분 갱신(refreshFlist)이 함께 쓴다 */
function flistBody(){
  const isFer = S.flist==='follower';
  const q = (S.fq||'').trim().toLowerCase();
  const meView = S.profile==='me';
  const targetId = meView ? (ME?ME.id:'') : (S.profileAid||'');
  const cached = targetId ? FLCACHE[targetId+'|'+S.flist] : null;

  /* 차단·신고한 사람은 팔로우 목록에서도 보이면 안 된다 (Guideline 1.2) */
  let rows = (cached || []).filter(p=>!isHiddenItem(p));
  if(q) rows = rows.filter(p=>((p.who||'').toLowerCase().includes(q) || (p.sub||'').toLowerCase().includes(q)));

  /* 검색 중이면 — 아직 팔로우 관계가 없어 목록에 안 뜨는 아티스트도 전체에서 찾아 보여준다.
     곡 올린 사람(allArtists) + 서버 프로필 검색(PSEARCH, 곡 없는 신규 가입자 포함) 합집합 */
  let extra = [];
  if(q){
    const known = new Set(rows.map(p=>p.aid).filter(Boolean));
    extra = allArtists().filter(p => p.aid && !known.has(p.aid) && !(ME && p.aid===ME.id)
      && !isHiddenItem(p)                                   /* 차단한 사람은 검색에도 안 뜬다 */
      && (p.who||'').toLowerCase().includes(q)).slice(0,30);
    const seen2 = new Set(extra.map(p=>p.aid));
    (PSEARCH.q===(S.fq||'').trim() ? PSEARCH.rows : []).forEach(p=>{
      if(p.aid && !known.has(p.aid) && !seen2.has(p.aid) && !(ME && p.aid===ME.id) && !isHiddenItem(p)){
        seen2.add(p.aid); extra.push(p);
      }
    });
  }

  const prowOf = p => { const on=MYFOLLOWS.has(p.aid), mine=ME&&p.aid===ME.id;
    return `<div class="prow">
    <span class="pgo" data-prof="${esc(p.who)}" data-paid="${p.aid||''}">${avatarEl(p.avatar, p.c, 0, p.who)}
      <span class="pnm"><b>${esc(p.who)}</b><small>${esc(p.sub||'')}</small></span></span>
    ${mine?'':`<button class="fol plfol ${on?'on':''}" data-aid="${p.aid||''}">${on?'팔로잉':'팔로우'}</button>`}
  </div>`; };
  const extraBody = extra.length
    ? `<div class="pldate" style="margin-top:14px">발견 · 새로 팔로우</div>${extra.map(prowOf).join('')}` : '';

  /* 최근 가입 섹션 — 검색어 없을 때 목록 아래에 항상. 나·이미 위에 나온 사람은 제외 */
  const recentBody = (()=>{
    if(q || !RECENTP || !RECENTP.length) return '';
    const shown=new Set(rows.map(p=>p.aid).filter(Boolean));
    const rec=RECENTP.filter(p=>p.aid && !shown.has(p.aid) && !(ME&&p.aid===ME.id) && !isHiddenItem(p)).slice(0,20);
    return rec.length ? `<div class="pldate" style="margin-top:14px">최근 가입한 사람들</div>${rec.map(prowOf).join('')}` : '';
  })();

  if(!targetId) return `<div class="pknote" style="padding:24px 0 10px">${meView?'로그인하면 내 팔로워를 볼 수 있어요':'불러올 수 없어요'}</div>` + recentBody;
  if(q){
    /* 검색 중 — 관계 목록 로딩과 무관하게 매칭 결과(관계 내 + 발견)를 바로 보여준다 */
    return (rows.length || extra.length)
      ? rows.map(prowOf).join('') + extraBody
      : ((cached===null||cached===undefined) ? `<div class="pknote" style="padding:36px 0">불러오는 중…</div>` : `<div class="pknote" style="padding:36px 0">찾는 아티스트가 없습니다</div>`);
  }
  if(cached===null||cached===undefined) return `<div class="pknote" style="padding:36px 0">불러오는 중…</div>` + recentBody;
  return (rows.length ? rows.map(prowOf).join('') : `<div class="pknote" style="padding:24px 0 10px">${isFer?'아직 팔로워가 없어요':'아직 팔로우한 사람이 없어요'}</div>`) + recentBody;
}

/* 검색 결과만 다시 그린다 — 입력창(#fq)은 절대 건드리지 않는다.
   예전엔 글자마다 render() 를 불러 입력창이 통째로 새로 만들어졌다. 그러면 한글 조합 중이던
   글자가 확정돼 커서가 다음 칸으로 넘어가 버린다(iOS 웹뷰는 조합 이벤트가 늦게 와서
   조합 중인지 판단할 수도 없었다). 그래서 목록만 갈아끼우고 그 안의 버튼만 다시 연결한다. */
function refreshFlist(){
  const el=document.getElementById('flbody');
  if(!el || S.view!=='flist') return;
  el.innerHTML=flistBody();
  const q=(S.fq||'').trim();
  const seg=document.getElementById('flseg'); if(seg) seg.style.display=q?'none':'';
  const lab=document.querySelector('.htitle small'); if(lab) lab.textContent=q?'검색':(S.flist==='follower'?'팔로워':'팔로잉');
  /* 지우기(✕) 버튼은 검색어가 있을 때만 — 입력창은 그대로 두고 버튼만 넣고 뺀다 */
  const row=document.querySelector('.srch'); let x=document.getElementById('fqx');
  if(q && !x && row){ x=document.createElement('button'); x.className='srchx'; x.id='fqx';
    x.setAttribute('aria-label','지우기'); x.textContent='✕'; row.appendChild(x); }
  if(!q && x){ x.remove(); x=null; }
  if(x) x.onclick=()=>{ S.fq=''; const i=document.getElementById('fq'); if(i)i.value=''; refreshFlist(); };
  /* 새로 만든 행의 버튼만 연결 — bind() 전체를 부르면 스토리 뷰어 리스너가 누적된다 */
  el.querySelectorAll('[data-prof]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); goProfile(b.dataset.prof, b.dataset.paid); });
  el.querySelectorAll('.fol').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const aid=b.dataset.aid;
    if(!ME){ needLogin(); return; }
    const on=b.classList.toggle('on');
    b.textContent=on?'팔로잉':'팔로우';
    (on?followArtist(aid):unfollowArtist(aid)).then(ok=>{
      if(!ok){ const back=b.classList.toggle('on'); b.textContent=back?'팔로잉':'팔로우'; }
    });
  });
}

/* 검색 중에는 render() 마다 불리므로 결과를 재사용한다 (곡 목록이 바뀌면 다시 만든다) */
let _artCache=null, _artCacheLen=-1;
function allArtists(){
  if(_artCache && _artCacheLen===ALLTRACKS.length) return _artCache;
  const seen={}, out=[];
  ALLTRACKS.forEach(t=>{ const key=t.aid||t.by; if(!key||seen[key])return; seen[key]=1;
    out.push({who:t.by, aid:t.aid||null, c:t.c, sub:'Artist'}); });
  _artCache=out; _artCacheLen=ALLTRACKS.length;
  return out;
}

   유튜브(watch/youtu.be/shorts)만 지원 — 공개 또는 일부공개(링크 공유) 모두 이 URL 형태로 접근 가능.
   id는 [a-zA-Z0-9_-]+ 로만 캡처되므로 속성 이탈 문자가 섞일 수 없고,
   embed URL은 이 안전한 값으로 새로 조립한다 — 원본 raw 문자열을 그대로 iframe에 넣지 않는다. */
function parsePerfVideo(raw){
  const u=String(raw==null?'':raw).trim();
  if(!/^https?:\/\//i.test(u)) return null;
  const m=u.match(/^https?:\/\/(?:www\.)?youtube\.com\/watch\?(?:[^\s#]*&)?v=([a-zA-Z0-9_-]{11})/i)
     || u.match(/^https?:\/\/youtu\.be\/([a-zA-Z0-9_-]{11})/i)
     || u.match(/^https?:\/\/(?:www\.)?youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/i);
  if(m) return {kind:'youtube', embed:'https://www.youtube-nocookie.com/embed/'+m[1]};
  return null;
}
let PERFTABLE=true;         /* perf_entries/perf_votes 테이블 사용 가능 여부 (없으면 false로 내려가고 조용히 폴백) */
const PERFCACHE={};         /* roundId -> true(로드완료/시도함), 중복요청 방지 */
let PROJECTTABLE=true;      /* project_entries 테이블 사용 가능 여부 (없으면 false로 내려가고 조용히 폴백) */
async function loadPerfEntries(roundId){
  const r=ROUNDS.find(x=>x.id===roundId);
  if(!r||!SBC||!PERFTABLE||PERFCACHE[roundId]) return;
  PERFCACHE[roundId]=true;
  try{
    const q=await SBC.from('perf_entries')
      .select('id,team_name,members,song_title,is_cover,style,video_url,votes_count,author_id')
      .eq('round_id',roundId).eq('hidden',false).order('votes_count',{ascending:false});
    if(q.error) throw q.error;
    const rows=q.data||[]; let voted={};
    if(ME&&rows.length){
      const vq=await SBC.from('perf_votes').select('entry_id').eq('voter_id',ME.id).in('entry_id',rows.map(x=>x.id));
      if(!vq.error) (vq.data||[]).forEach(v=>{voted[v.entry_id]=1});
    }
    r.cands=rows.map(row=>({kind:'perf', id:row.id, team:row.team_name, members:row.members,
      songTitle:row.song_title, isCover:!!row.is_cover, style:row.style, videoUrl:row.video_url,
      v:row.votes_count||0, voted:!!voted[row.id], me:!!(ME&&row.author_id===ME.id)}));
    render();
  }catch(e){
    if(e&&(e.code==='PGRST205'||e.code==='42P01')){ PERFTABLE=false;
      console.info('[offlog] perf_entries 테이블이 없습니다 — supabase/perf-entries.sql 실행 필요'); return; }
    console.warn('[offlog] 공연 신청 목록 로드 실패', e); PERFCACHE[roundId]=false;
  }
}

/* My 페이지 CONCERT 탭 — 내가 낸 지원서 전체(모든 라운드). null=아직 안 불러옴 */
let MYPERF=null, MYPERF_UID=null;
function loadMyPerf(){
  if(!ME||!SBC||!PERFTABLE) return;
  if(MYPERF_UID===ME.id) return;   /* 이미 이 유저 걸로 불러왔거나 불러오는 중 */
  MYPERF_UID=ME.id;
  SBC.from('perf_entries')
    .select('id,round_id,team_name,members,song_title,is_cover,style,video_url,votes_count,hidden,created_at')
    .eq('author_id',ME.id).order('created_at',{ascending:false})
    .then(({data,error})=>{
      if(error){
        MYPERF_UID=null;
        if(error.code==='PGRST205'||error.code==='42P01'){ PERFTABLE=false; render(); return; }  /* 테이블 준비 전 — CONCERT 탭이 계속 로딩 중으로 멈추지 않게 다시 그린다 */
        console.warn('[offlog] 내 공연 지원 목록 로드 실패', error); return;
      }
      MYPERF=data||[]; render();
    });
}

function rotOf(id){ let h=0; const s=String(id); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return (h%9)-4; }
function tierOf(rank){ return rank<3?'S':rank<10?'A':rank<20?'B':'C'; }

  /* 공연 신청은 My 페이지(＋공연 지원 박스)에서 한다 — 여기는 투표만 */
  const body = rounds.map(r=>{
    const shown=[...r.cands].map((d,i)=>({...d,_i:i})).sort((a,b)=>b.v-a.v).slice(0,20);
    const head = `<div class="y2kstub"><span class="y2kadm">${r.type==='curated'?'CURATED':'OPEN'}</span>

    const cards = shown.map((d,rank)=>{
      const top=rank===0;
      /* 공연 신청 후보 — 포스터월 카드(영상 펼쳐보기). 음원 후보와 완전히 다른 데이터 모양이라 조기 반환 */
      if(d.kind==='perf'){
        const expanded=S.perfExpand===d.id, vid=parsePerfVideo(d.videoUrl);
        return `<div class="y2kcard ${expanded?'expanded':''}" style="--rot:${rotOf(d.id)}deg" data-pexpand="${d.id}">
          <div class="y2kribbon"><b>${esc(d.team)}</b></div>

          </div>

            <button class="votebtn ${d.voted?'on':''}" data-vote="${r.id}|${d._i}" aria-label="투표">${d.voted?'✓':'▲'}</button></div>
          ${expanded?`<div class="cex">
            ${vid?`<iframe class="cvidframe" src="${vid.embed}" title="${esc(d.team)} 영상" loading="lazy"
                sandbox="allow-scripts allow-same-origin allow-presentation allow-popups"
                allow="encrypted-media; picture-in-picture" allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"></iframe>`
              :`<a class="cgo" href="${safeUrl(d.videoUrl)}" target="_blank" rel="noopener noreferrer">원본 링크에서 영상 보기 ↗</a>`}
            <div class="cexh" style="margin-top:8px">${esc(d.songTitle)} · ${d.isCover?'커버':'오리지널'}${d.style?' · '+esc(d.style):''}</div>
            <div class="cexh" style="margin-top:4px">참가자 · ${esc(d.members)}</div>
          </div>`:''}
        </div>`;
      }
      const who=artOf(d);
      const logs=ARTLOGS[who]||[];
      const preview = logs[0]
        ? (logs[0].t==='note' ? `<span class="cprev note">✎ ${logs[0].tx}</span>`
                               : `<span class="cprev snd">♪ ${logs[0].tx}</span>`)
        : `<span class="cprev empty">아직 공개된 로그가 없습니다</span>`;
      return `<div class="y2krow ${d.voted?'voted':''}" data-goart="${who}">
        <span class="y2krank tier-${tierOf(rank)} ${top?'top':''}">${rank+1}</span>
        <button class="cplay y2kplay" data-cp aria-label="재생">▶</button>

          ${preview}

        <span class="y2kvside">
          <button class="votebtn y2kvbtn ${d.voted?'on':''}" data-vote="${r.id}|${d._i}">${d.voted?'✓':'▲'}</button>
          <b class="y2kvc">${d.v}</b>

  }).join('<div style="height:14px"></div>');

/* 진행중인 프로젝트 지원 — 프로젝트마다 음원(파일)/영상(URL) 타입이 고정돼 있어
   고른 프로젝트에 따라 업로드 필드가 바뀐다 */
function projectMissing(){
  const P=S.projectForm||{}, proj=PROJECTS.find(x=>x.id===P.project), m=[];
  if(!P.project) m.push('프로젝트 선택');
  if(!P.name?.trim()) m.push('이름');
  if(!P.contact?.trim()) m.push('연락처');
  if(proj){
    if(proj.type==='audio' && !P.audioFile) m.push('음원 파일');
    if(proj.type==='video'){
      if(!P.video?.trim()) m.push('영상 URL');
      else if(!parsePerfVideo(P.video)) m.push('영상 URL(유튜브만 지원)');
    }
  }
  return m;
}
function projectApplySheet(){
  const P=S.projectForm||{};
  const proj=PROJECTS.find(x=>x.id===P.project);
  const miss=projectMissing();
  return `<div class="sheet-bd" id="pjbd"></div>
  <div class="pksheet tall">
    <div class="pkhd"><b>프로젝트 지원</b><span class="pksub">선정되면 연락드려요</span>
      <button class="pkx" id="pjclose" aria-label="닫기">✕</button></div>

    <div class="rsec">지원할 프로젝트</div>
    <div class="evpick">${PROJECTS.map(p=>`<button class="evopt ${P.project===p.id?'on':''}" data-pjproject="${p.id}">
      <b>${esc(p.brand)}</b><small>${esc(p.who)} · ${p.type==='audio'?'음원 파일':'영상 URL'}</small></button>`).join('')}</div>

    <div class="rsec">이름</div>
    <input class="cs-name" id="pjname" value="${esc(P.name||'')}" placeholder="이름 (아티스트명)">

    <div class="rsec">연락처</div>
    <div class="crow"><input class="cin" id="pjcontact" value="${esc(P.contact||'')}" placeholder="선정 시 연락드릴 전화번호 또는 이메일"></div>
    <p class="rulen" style="text-align:left;margin:0 4px 4px;color:var(--muted);font-size:11px">선정 시에만 연락드려요 — 목록에는 공개되지 않아요</p>

    <div class="rsec">한 줄 소개 <em class="opt">선택</em></div>
    <div class="crow"><input class="cin" id="pjnote" value="${esc(P.note||'')}" placeholder="간단한 소개나 하고 싶은 말"></div>

    ${!proj ? ''

        ? `<div class="rsec">음원 파일 <em class="opt">MP3 · WAV</em></div>
           <button class="cs-name" id="pjaudiobtn" style="text-align:left;cursor:pointer">${P.audioName?esc(P.audioName):'파일 선택 (MP3 또는 WAV)'}</button>
           <input type="file" id="pjaudiofile" accept="audio/mpeg,audio/mp3,audio/wav,audio/x-wav,audio/wave,.mp3,.wav" hidden>
           <p class="rulen" style="text-align:left;margin:6px 4px 0;color:var(--muted);font-size:11px">MP3, WAV 파일만 올릴 수 있어요 · 최대 45MB</p>`
        : `<div class="rsec">영상 URL <em class="opt">유튜브만 지원</em></div>
           <div class="crow"><input class="cin" id="pjvideo" value="${esc(P.video||'')}" placeholder="https://youtube.com/watch?v=..."></div>`}

    <button class="cta" id="pjdone" ${miss.length?'disabled':''}>지원하기</button>
    ${miss.length?`<div class="missn">${miss.join(' · ')} 필요</div>`:''}
  </div>`;
}

/* ── Work — 음악이 위에 있고, 그 아래에 그 음악의 모든 로그가 펼쳐진다 ── */
function work(){
  const w=WORKS.find(x=>x.id===S.work)||WORKS[0];
  const story=w.id==='sr'?STORY:STORY.slice(0,3);
  const chips=[['all','전체'],['demo','Demo'],['pic','사진'],['vid','영상'],['idea','아이디어'],['voice','보이스'],['note','노트']];
  const scard=r=>{
    /* 작품 스토리 안 = 이미 담긴 것들. 뱃지 불필요 */
    const chrome=`<div class="rwho" data-prof="${esc(r.who)}" style="cursor:pointer">${avatarEl(avOf(r.who), r.c, 24, r.who)}${esc(r.who)}</div>`;
    if(r.t==='ph')return `<div class="rcard upcard" style="height:180px">
      <div class="bgimg" style="background:${r.bg}"></div><div class="grainy"></div>
      <div class="rmid"><div class="rts">${r.at}</div><div class="rcap">${r.cap}</div></div>
      <div class="uphint2">📷 탭해서 사진 넣기</div>${chrome}</div>`;
    if(r.t==='snd')return `<div class="rcard snd" data-play${r.audio?` data-audio="${r.audio}"`:''} style="height:170px">
      <div class="bigwv">${waveBars(30)}</div>
      <div class="rmid"><div class="rts">${r.at}</div><div class="rcap">${r.cap}</div>
        <span class="sndpill"><em>▶</em><b>${r.dur}</b></span></div>${chrome}</div>`;
    return `<div class="rcard paper ${r.tone==='b'?'b':''}" style="height:170px">
      <div class="rmid"><div class="rts">${r.at}</div><div class="rnote">${r.text.replace(/\n/g,'<br>')}</div></div>${chrome}</div>`;
  };
  const groups=story.map(g=>{
    const items=g.items.filter(i=>S.wf==='all'||i.tag===S.wf);
    if(!items.length)return '';
    return `<div class="dayhd ${g.rel?'rel':''}"><b>${g.day}</b><small>${g.date}</small></div>${items.map(scard).join('')}`;
  }).join('');
  /* 내가 만든 작품 = 큐레이션한 발매 로그를 날짜별 타임라인으로 */
  const logCard=l=>{
    if(l.t==='snd')return `<div class="rcard snd" data-play${l.audio?` data-audio="${l.audio}"`:''} style="height:150px"><div class="bigwv">${waveBars(28)}</div><div class="rmid"><div class="rts">${l.at||''}</div><div class="rcap">${l.nm||l.cap||''}</div><span class="sndpill"><em>▶</em><b>${l.dur||''}</b></span></div></div>`;
    if(l.t==='vid')return `<div class="rcard" style="height:180px;overflow:hidden"><video src="${l.src}" controls playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video><div class="rmid" style="pointer-events:none"><div class="rts">${l.at||''}</div>${l.cap?`<div class="rcap">${esc(l.cap)}</div>`:''}</div></div>`;
    if(l.t==='ph')return `<div class="rcard" style="height:180px"><div class="bgimg" style="background:${l.bg||'#141418'}"></div><div class="grainy"></div><div class="rmid"><div class="rts">${l.at||''}</div><div class="rcap">${l.cap||''}</div></div></div>`;
    return `<div class="rcard paper ${l.tone==='b'?'b':''}" style="height:150px"><div class="rmid"><div class="rts">${l.at||''}</div><div class="rnote">${(l.text||'').replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div></div></div>`;
  };
  const mineTimeline=()=>{
    const logs=(w.releaseLogs||[]).map(id=>STREAM.find(l=>l.id===id)).filter(Boolean);
    if(!logs.length) return `<div class="expire">아직 담은 발매 로그가 없어요 · 아래 <b>발매 로그 고르기</b>로 추가하세요</div>`;
    const byDt={}; logs.forEach(l=>{ const d=l.dt||'zzz'; (byDt[d]=byDt[d]||[]).push(l); });
    return Object.keys(byDt).sort().reverse().map(d=>{
      const label=(d==='zzz')?'날짜 미상':d.replace(/-/g,'.');
      return `<div class="dayhd"><b>${label}</b><small>${byDt[d].length}개</small></div>${byDt[d].map(logCard).join('')}`;
    }).join('');
  };
  /* 커버/아티스트 기반 강조색 (Spotify처럼 위에서 아래로 번지는 색) */
  const _PAL=['coral','blue','green','yellow','purple','shpink','mint'];
  let _ah=0; const _as=String(w.by||w.nm||''); for(let k=0;k<_as.length;k++)_ah=(_ah*31+_as.charCodeAt(k))|0;
  const acc=c(_PAL[Math.abs(_ah)%_PAL.length])||'#3a3a44';
  const working=(!w.date || w.date==='작업 중');
  const relTxt=working?'작업 중':(w.pending?'발매 예약 '+w.date:(w.date?'발매 '+w.date:'미발매'));
  const _cov=safeUrl(w.cover);
  return `<div class="hd"><button class="circ" data-v="mine" aria-label="뒤로"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg></button>
    <div class="htitle"></div>
    <div class="r"><button class="circ" aria-label="공유">⤴</button></div></div>
  <div class="whero2" style="--acc:${acc}">
    <div class="wcov2 ${_cov?'':'empty'}" style="${_cov?`background-image:url(${_cov})`:'background:'+w.bg}">
      ${_cov?'':`<span class="wcov-hint">🖼<br>${w.mine?'발매에서 커버':'커버'}</span>`}</div>
    <h1 class="wtitle2">${esc(w.nm)}</h1>
    <div class="wsub2"><button class="wartist" data-prof="${esc(w.by||'나')}">${esc(w.by||'나')}</button>
      <span class="wdot">·</span><span>${relTxt}</span>
      ${w.logs?`<span class="wdot">·</span><span>${w.logs} Logs</span>`:''}</div>
    <div class="wactions">
      <div class="wicons">
        <button class="wicon" id="wsave" aria-label="플레이리스트에 담기"><span>＋</span><i>담기</i></button>
        <button class="wicon" aria-label="공유"><span>⤴</span><i>공유</i></button>
        ${w.mine ? (working
          ? `<button class="wicon acc" id="relbtn" aria-label="음원 발매"><span>◎</span><i>발매</i></button>`
          : `<button class="wicon" id="relbtn" aria-label="발매 정보 수정"><span>✎</span><i>수정</i></button>`) : ''}
      </div>
      <button class="wplay2" id="wplaybig" aria-label="재생"></button>
    </div>
    ${w.mine && !working && w.date ? `<div class="wrelbar"><span class="ap-dot" style="background:var(--lemon);box-shadow:0 0 8px var(--lemon)"></span><b>${w.date}</b> 발매 예약</div>`:''}
  </div>
  ${w.mine && w.credits&&(w.credits.comp||w.credits.lyri||w.credits.arr||w.credits.prod) ? `<div class="wsec"><div class="wsec-t">크레딧</div><div class="wcredits">${w.credits.comp?`<span>작곡 <b>${esc(w.credits.comp)}</b></span>`:''}${w.credits.lyri?`<span>작사 <b>${esc(w.credits.lyri)}</b></span>`:''}${w.credits.arr?`<span>편곡 <b>${esc(w.credits.arr)}</b></span>`:''}${w.credits.prod?`<span>프로듀서 <b>${esc(w.credits.prod)}</b></span>`:''}</div></div>`:''}
  ${w.mine && (w.inst || w.lyr) ? `<div class="wsec"><div class="wsec-t">가사</div><div class="wlyr"${w.inst?' style="color:var(--muted)"':''}>${w.inst?'연주곡 (가사 없음)':w.lyr.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div></div>`:''}
  ${w.mine?lvRow(w):eventStatus(w)}
  <div class="sechd">
    <div class="sec" style="margin:0">${w.mine?'음원 로그':'The Story'}</div></div>
  ${w.mine?'':`<div class="mchips">${chips.map(([k,l])=>`<button class="mchip ${S.wf===k?'on':''}" data-wf="${k}">${l}</button>`).join('')}</div>`}
  <div class="daytl">${w.mine?mineTimeline():groups}</div>
  ${(!w.mine&&w.id==='ml')?`<div class="expire">이 스토리는 지금도 자라는 중 · <b>91 Logs</b></div>`:''}
  ${S.relpick?releaseLogPicker(w):''}
  ${S.pull?logPuller(w):''}
  ${S.stage?stageSheet(w):''}
  ${S.addlist?listPicker(w):''}
  ${S.rel?releaseSheet(w):''}
  <div style="height:14px"></div>`;
}

function pushLog(txt, m, audioUrl){

  const d=new Date(), p=x=>String(x).padStart(2,'0'), now=p(d.getHours())+':'+p(d.getMinutes());
  const dt=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()), id='my_'+d.getTime();
  let log;
  if(m && m.kind==='vid')      log={id, t:'vid', at:now, dt, cap:txt, src:m.url, side:'l', work:null};
  else if(m && m.kind==='aud') log={id, t:'snd', at:now, dt, nm:txt||'데모', dur:'', audio:audioUrl||m.url, media:audioUrl||'', side:'l', work:null};
  else if(m && m.kind==='ph')  log={id, t:'ph',  at:now, dt, cap:txt||'사진', bg:'center/cover no-repeat url('+m.url+')', side:'l', work:null};
  else{ const _tone=['y','b','p'][STREAM.filter(x=>x&&x.t==='note').length%3];   /* 포스트잇 색을 노랑→하늘→핑크로 번갈아 */
                               log={id, t:'note',at:now, dt, text:txt, tone:_tone, side:'l', work:null}; }
  /* 기본 공개 — 작성 시트에서 공개/비공개 토글을 뺐다(친구 피드가 비지 않게).
     비공개로 바꾸는 건 My 페이지 각 카드의 공개/비공개 칩에서 */
  log.vis=(S.compose&&S.compose.vis==='private')?'private':'public';
  log.act=(S.compose&&S.compose.act)||null;                            /* 활동 태그(연습/공연/작업/기타) — 분석표용 */
  STREAM.unshift(log);
  SESSION_NEW.add(id);          /* 방금 올린 것 → 맨 위 핀(루틴 피드 위에) */
  studioSave();
  S.compose=null;
  if(S.view!=='mine' || S.profile!=='me'){ S.view='mine'; S.profile='me'; }
  render();
  /* 로그인 전에는 서버로 못 보낸다(아래 async 블록이 조용히 return).
     그런데도 "올렸어요"라고 하면 올라간 줄 알고 기기를 바꾸는 순간 사라진다.
     그래서 정직하게 알리고 로그인 시트를 띄운다 — 글은 이미 기기에 남아 있고,
     로그인하면 syncPendingLogs 가 sid 없는 my_ 로그를 자동으로 올려준다. */
  if(!ME){ offToast('이 기기에 저장했어요 · 로그인하면 올라갑니다'); S.login=true; render(); }
  else offToast('로그를 올렸어요');
  /* 서버에 영구 저장 — 사진·영상 원본은 Storage로 올리고 URL만 남긴다 */
  (async function(){
    try{
      if(!ME||!SBC) return;                       /* 비로그인 → 이 기기에만 */
      if(m && m.file && (m.kind==='ph'||m.kind==='vid')){
        /* 크기 초과는 tooBigToUpload 가 이유를 알려준다. 그 외 실패는 여기서 알린다 —
           조용히 넘기면 로그는 저장됐는데 사진만 사라진 상태가 된다(다른 기기에서 안 보임). */
        const okSize=!tooBigToUpload(m.file, m.kind);

        if(url){ log.media=url;
          if(log.t==='ph') log.bg='center/cover no-repeat url('+url+')';
          if(log.t==='vid') log.src=url;
          try{studioSave()}catch(_){}
          try{render()}catch(_){}
        } else if(okSize){
          offToast((m.kind==='vid'?'영상':'사진')+'을 서버에 올리지 못했어요 — 이 기기에만 남습니다');
        }
      }
      await saveLogRemote(log);
    }catch(e){ console.warn('[offlog] 로그 저장 후처리 실패', e); }
  })();
}
/* 파일이 정말 오디오인가 — accept="audio/*" 는 폰 파일 선택창에서 느슨하게 적용돼서
   영상도 골라진다. 실제로 audio 버킷에 .mov/.mp4 영상 7개(109MB)가 들어가 있었고,
   그것들이 '음원 로그'로 만들어져 화면엔 소리만 나오는 카드가 됐다. */
function isVideoFile(f){
  if(!f) return false;
  if(/^video\//i.test(f.type||'')) return true;
  return /\.(mov|mp4|m4v|avi|mkv|webm|3gp|hevc)$/i.test(f.name||'');
}
/* ── 영상 30초 자르기 ────────────────────────────────────────────────
   왜: 폰 영상은 45MB까지 올라와 무료 저장소(1GB)를 금방 채운다. 그리고 사람들이
   보는 건 하이라이트 몇 초다. 폰 갤러리 앱에서 미리 자르고 오라고 하는 대신
   여기서 구간을 고르게 하고, 가능하면 그 구간만 새 파일로 만들어 올린다.
   재인코딩이 안 되는 기기에서는 원본을 올리되 구간(start/end)만 기억해 그 부분만 재생한다. */
const TRIM_MAX=30;      /* 초 — 이 길이를 넘겨 담을 수 없다 */
function openTrimmer(file){
  const url=URL.createObjectURL(file);
  S.trim={file:file, url:url, dur:0, start:0, end:TRIM_MAX, busy:false, ready:false};
  const v=document.createElement('video'); v.preload='metadata'; v.muted=true;
  v.onloadedmetadata=function(){
    const d=isFinite(v.duration)?v.duration:0;
    S.trim.dur=d; S.trim.end=Math.min(d||TRIM_MAX, TRIM_MAX); S.trim.ready=true;
    try{render()}catch(_){}
  };
  v.onerror=function(){ S.trim.dur=0; S.trim.ready=true; try{render()}catch(_){} };
  v.src=url;
}
function closeTrimmer(keep){
  if(S.trim && S.trim.url && !keep){ try{URL.revokeObjectURL(S.trim.url)}catch(_){} }
  S.trim=null;
}
const _fmtT=s=>{ s=Math.max(0,s||0); const m=Math.floor(s/60), r=Math.floor(s%60);
  return m+':'+String(r).padStart(2,'0'); };
/* 실제로 잘라낸다 — 고른 구간을 재생하면서 화면+소리를 그대로 다시 녹화한다.
   자른 길이만큼 시간이 걸리고(10초 구간=10초), 기기가 지원해야 한다. */
function canReencode(){
  try{
    return typeof MediaRecorder!=='undefined'
      && ('captureStream' in HTMLMediaElement.prototype)
      && _recMime()!=='';
  }catch(_){ return false; }
}
function _recMime(){
  const cands=['video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(const t of cands){ try{ if(MediaRecorder.isTypeSupported(t)) return t; }catch(_){} }
  return '';
}
function trimVideo(file, start, end, onProgress){
  return new Promise(function(resolve, reject){
    const mime=_recMime(); if(!mime) return reject(new Error('no-recorder'));
    const v=document.createElement('video');
    v.src=URL.createObjectURL(file); v.playsInline=true; v.muted=false; v.volume=1;
    /* 화면 밖에 두되 display:none 은 쓰지 않는다 — 숨기면 프레임이 안 그려지는 브라우저가 있다 */
    v.style.cssText='position:fixed;left:-9999px;top:0;width:320px;height:180px;opacity:.01;pointer-events:none';
    document.body.appendChild(v);
    let rec=null, chunks=[], done=false, timer=0;
    const cleanup=()=>{ clearInterval(timer); try{v.pause()}catch(_){}
      try{URL.revokeObjectURL(v.src)}catch(_){} try{v.remove()}catch(_){} };
    const fail=e=>{ if(done)return; done=true; cleanup(); reject(e); };
    v.onloadedmetadata=function(){
      let stream;
      try{ stream=(v.captureStream||v.mozCaptureStream).call(v); }catch(e){ return fail(e); }
      if(!stream) return fail(new Error('no-stream'));
      try{ rec=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:2500000}); }
      catch(e){ return fail(e); }
      rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
      rec.onstop=function(){
        if(done)return; done=true; cleanup();
        const blob=new Blob(chunks,{type:mime.split(';')[0]});
        if(!blob.size) return reject(new Error('empty'));
        const ext=blob.type.indexOf('mp4')>-1?'mp4':'webm';
        resolve(new File([blob], 'clip'+Date.now()+'.'+ext, {type:blob.type}));
      };
      v.currentTime=start;
      v.onseeked=function(){
        v.onseeked=null;
        try{ rec.start(200); }catch(e){ return fail(e); }
        v.play().catch(fail);
        timer=setInterval(function(){
          if(onProgress) onProgress(Math.min(1,(v.currentTime-start)/Math.max(.001,end-start)));
          if(v.currentTime>=end || v.ended){ clearInterval(timer);
            try{ rec.state!=='inactive' && rec.stop(); }catch(_){} }
        }, 100);
      };
    };
    v.onerror=()=>fail(new Error('video-error'));
    setTimeout(()=>{ if(!done) fail(new Error('timeout')); }, (end-start)*1000+30000);  /* 안전장치 */
  });
}
/* 시트에서 '이 구간으로' 를 누르면 여기로 온다 */
async function applyTrim(){
  const T=S.trim; if(!T||T.busy) return;
  const len=Math.max(0.2, T.end-T.start);
  T.busy=true; render();
  let out=T.file, trimmed=false;
  if(canReencode() && T.dur>0){
    try{
      out=await trimVideo(T.file, T.start, T.end, function(p){
        const el=document.getElementById('trimpct'); if(el) el.textContent=Math.round(p*100)+'%';
      });
      trimmed=true;
    }catch(e){
      console.warn('[offlog] 영상 자르기 실패 — 원본을 올리고 구간만 저장', e);
      offToast('이 기기에선 잘라 올릴 수 없어 원본을 올려요 (그 구간만 재생됩니다)');
    }
  }
  if(!S.compose) S.compose={text:'',media:null};
  S.compose.media={kind:'vid', url:URL.createObjectURL(out), file:out,
                   clipStart: trimmed?0:T.start, clipEnd: trimmed?len:T.end};
  closeTrimmer();
  render();
}

/* 담기 저장 — 로컬 demoOf + (컬럼이 있으면) 서버 demo_id */
async function saveDemoPick(){
  const P=S.demoPick; if(!P) return;
  const demo=STREAM.find(x=>x&&x.id===P.id);
  if(!demo||!demo.sid){ offToast('데모가 아직 서버에 저장되지 않았어요'); return; }
  const before=STREAM.filter(l=>l&&l.demoOf===demo.sid).map(l=>l.id);
  /* 로컬 반영: 고른 건 담고, 골랐다가 뺀 건 푼다 */
  STREAM.forEach(function(l){
    if(!l) return;
    if(P.sel.includes(l.id)) l.demoOf=demo.sid;
    else if(l.demoOf===demo.sid) l.demoOf=null;
  });
  try{studioSave()}catch(_){}
  S.demoPick=null; render();
  offToast(P.sel.length? P.sel.length+'개 기록을 담았어요' : '담긴 기록을 비웠어요');
  /* 서버 반영 — 서버에 있는 로그(sid)만. 실패해도 로컬은 유지되고 다음 로드 때 다시 맞춘다 */
  if(!ME||!SBC||!LOGSTABLE||!LOGSDEMO) return;
  try{
    const addSids=P.sel.map(id=>{ const l=STREAM.find(x=>x&&x.id===id); return l&&l.sid; }).filter(Boolean);
    const rmSids =before.filter(id=>!P.sel.includes(id))
                        .map(id=>{ const l=STREAM.find(x=>x&&x.id===id); return l&&l.sid; }).filter(Boolean);
    if(addSids.length){ const r=await SBC.from('logs').update({demo_id:demo.sid}).in('id',addSids); if(r.error)throw r.error; }
    if(rmSids.length){ const r=await SBC.from('logs').update({demo_id:null}).in('id',rmSids); if(r.error)throw r.error; }
  }catch(e){
    if(/demo_id/i.test(String(e&&e.message||''))){ LOGSDEMO=false;
      console.info('[offlog] logs.demo_id 컬럼 없음 — supabase/logs-demo-link.sql 실행 필요'); return; }
    console.warn('[offlog] LOG 담기 서버 저장 실패', e);
    offToast('담기가 서버에 저장되지 않았어요 — 연결 확인 후 다시 시도해 주세요');
  }
}

/* 내 로그 ⋯ — 그 로그의 음악·데모·사진을 다시 받기(다운로드). 글은 복사 */
function downloadLog(id){
  const l=STREAM.find(x=>String(x.id)===String(id)); if(!l){ offToast('로그를 못 찾았어요'); return; }
  let url='', name='';
  if(l.t==='snd'){ url=l.audio||''; name=(l.nm||'데모')+'.mp3'; }
  else if(l.t==='vid'){ url=l.src||''; name=(l.cap||'영상')+'.mp4'; }
  else if(l.t==='ph'){ url=(String(l.bg||'').match(/url\(["']?(.*?)["']?\)/)||[])[1]||''; name=(l.cap||'사진')+'.jpg'; }
  else { if(navigator.clipboard){ navigator.clipboard.writeText(l.text||'').then(()=>offToast('글을 복사했어요')).catch(()=>offToast('복사 실패')); } else offToast('복사할 수 없어요'); return; }
  if(!url){ offToast('받을 파일이 없어요 (샘플 로그예요)'); return; }

}
/* 내 로그 공유 — 링크(+글 내용)를 시스템 공유 시트로, 안 되면 클립보드로 */

   실패해도 로컬은 이미 지워진 상태를 유지한다(사용자 의도가 삭제이므로 복원이 더 이상함) */
async function deleteLog(id){

/* 글 로그에 사진/데모 붙이기 → 미디어 카드로 (사진=캡션, 데모=데모카드) */
function attachMedia(id, kind, file){
  const l=STREAM.find(x=>String(x.id)===String(id)); if(!l){ offToast('로그를 못 찾았어요'); return; }
  const txt=(l.text||'').trim();
  if(kind==='ph'){
    /* 원본 base64는 저장 용량을 넘겨 저장이 통째로 실패한다 → 줄여서 넣고, 원본은 서버로 */
    shrinkImage(file).then(function(small){
      l.t='ph'; l.cap=txt||'사진'; l.bg='center/cover no-repeat url('+(small||'')+')';
      delete l.text; delete l.tone; studioSave(); render(); offToast('사진을 넣었어요');
      (async function(){ try{
        const okSize=!tooBigToUpload(file,'ph');
        const url=okSize ? await uploadLogMedia(file,'ph') : '';
        if(url){ l.media=url; l.bg='center/cover no-repeat url('+url+')'; studioSave(); render(); }
        else if(okSize) offToast('사진을 서버에 올리지 못했어요 — 이 기기에만 남습니다');
        if(l.sid && ME && SBC && LOGSTABLE){
          try{ await SBC.from('logs').update({kind:'ph', caption:l.cap, media_url:l.media||null, text:null, tone:null}).eq('id',l.sid); }catch(_){}
        } else { await saveLogRemote(l); }
      }catch(e){ console.warn('[offlog] 사진 첨부 서버 반영 실패', e); } })();
    });
    return;
  }
  const apply=au=>{ l.t='snd'; l.nm=txt||'데모'; l.dur=''; l.audio=au; delete l.text; delete l.tone; studioSave(); render(); offToast('데모를 넣었어요'); };
  if(ME && SBC){
    if(tooBigToUpload(file,'aud')) return;
    (async()=>{ try{
      const ext=((file.name||'').split('.').pop()||'mp3').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp3';
      const path=ME.id+'/logs/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.'+ext;
      const up=await retryUp(async function(){
        const r=await SBC.storage.from('audio').upload(path, file, {contentType:file.type||'audio/mpeg', upsert:true});
        if(r.error) throw r.error;
        return r;
      });
      const pub=SBC.storage.from('audio').getPublicUrl(path);
      apply((pub&&pub.data&&pub.data.publicUrl)||'');
    }catch(e){
      /* blob 주소는 이 세션에서만 유효하다 — 앱을 닫으면 소리가 사라진다.
         지금 들어보는 건 되게 하되, 임시라는 걸 반드시 알린다(예전엔 조용히 넘어갔다). */
      console.warn('[offlog] 데모 첨부 업로드 실패', e);
      apply(URL.createObjectURL(file));
      offToast('데모를 서버에 올리지 못했어요 — 지금만 들을 수 있으니 다시 올려주세요');
    } })();
  } else { apply(URL.createObjectURL(file)); }
}
/* 친구 초대 — 내 아이디를 붙인 초대 링크를 네이티브 공유 시트나 클립보드로 넘긴다.
   ?inv=<내 id> 는 받는 쪽에서 "누가 불렀는지" 표시하는 데만 쓴다(가입 강제 아님). */
async function offInvite(){
  const base=location.origin+'/offlog';
  const url = (ME&&ME.id) ? base+'?inv='+encodeURIComponent(ME.id) : base;
  const nm  = (ME&&ME.name) ? ME.name : '친구';

  try{ if(navigator.share){ await navigator.share({title:'OFFLOG 초대', text:txt, url:url}); return; } }
  catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(txt+'\n'+url); offToast('초대 링크가 복사됐어요'); }
  catch(_){ offToast('초대 링크: '+url); }
}
/* 남의 음악 공유 — 네이티브 공유 or 링크 복사 */
async function offShareTrack(M){
  const url=location.origin+'/offlog';
  const title=((M&&M.nm)?M.nm:'음악')+((M&&M.by)?' · '+M.by:'');
  try{ if(navigator.share){ await navigator.share({title:title, url:url}); } else { await navigator.clipboard.writeText(url); offToast('링크가 복사됐어요'); } }
  catch(e){ try{ await navigator.clipboard.writeText(url); offToast('링크가 복사됐어요'); }catch(_){ offToast('링크: '+url); } }
}
function _anchorDL(href, name){ const a=document.createElement('a'); a.href=href; a.download=name; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove(); }
/* data:/blob: 는 바로 저장. http(s)(Storage)는 blob으로 받아 실제 저장 — download 속성은 cross-origin이면 무시되므로 */
function _saveFile(url, name){
  if(/^(data:|blob:)/.test(url)){ _anchorDL(url, name); offToast('저장했어요'); return; }
  offToast('받는 중…');
  fetch(url).then(function(r){ if(!r.ok) throw 0; return r.blob(); })
    .then(function(b){ const u=URL.createObjectURL(b); _anchorDL(u, name); setTimeout(function(){URL.revokeObjectURL(u)},5000); offToast('저장했어요'); })
    /* 예전엔 CORS 로 막히면 window.open 으로 새 탭에 열었다. 앱(웹뷰)에는 탭이 없어서
       같은 화면에 파일이 로드되고 앱을 벗어나 버린다 → 링크 복사로 대체한다. */
    .catch(function(){
      try{ if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url);
        offToast('바로 저장이 안 돼요 — 링크를 복사했으니 브라우저에서 열어 저장해 주세요'); return;
      } }catch(_){}
      offToast('저장에 실패했어요 — 잠시 후 다시 시도해 주세요');
    });
}
/* 실제 음악 업로드 — Storage(audio) + tracks (로그인 아티스트) */

const WGRAD='radial-gradient(circle at 30% 25%,#4a2f66,transparent 60%),radial-gradient(circle at 80% 75%,#173f38,transparent 55%),#101014';

/* ── 미니 플레이어 ── 곡·리스트명은 실제 데이터(NOWPLAY)에서 온다 */
let NOWPLAY={label:'발견', cnt:0, nm:'', tm:'', src:'', who:'', aid:'', tid:''};

/* ── 실제 오디오 재생 (전역 Audio 1개) ── 재생버튼에 진짜 mp3를 물린다 */
/* preload='none' 이면 재생 버튼을 누른 뒤에야 네트워크 요청이 시작돼 1초 넘게 기다렸다.
   'metadata' 로 두면 src 지정 시점에 앞부분을 미리 받아 탭하자마자 소리가 난다. */
const AUDIO=new Audio(); AUDIO.preload='metadata';
/* 음악바 시간·막대 갱신 (드래그 중에는 손가락 우선) */
AUDIO.addEventListener('timeupdate', function(){ if(!_seekDrag) paintSeek(); });
AUDIO.addEventListener('loadedmetadata', function(){ paintSeek(); });
AUDIO.addEventListener('progress', function(){ if(!_seekDrag) paintSeek(); });
AUDIO.addEventListener('ended', function(){ S.mini.playing=false; try{renderMini()}catch(_){} });
let CURSRC='';
function _clearPlayingUI(){
  document.querySelectorAll('.rcard.playing').forEach(function(x){
    x.classList.remove('playing');
    var em=x.querySelector('.sndpill em'); if(em)em.classList.remove('on');
  });
  document.querySelectorAll('.cprog').forEach(function(x){ x.remove(); });
}
/* 카드 안 재생 진행바 — 재생 중인 카드 하단에 진행 상황을 그린다.
   피드 카드는 뮤직바(팝업) 없이 카드 자체가 플레이어라서, 진행이 카드 안에 보여야 한다 */
AUDIO.addEventListener('timeupdate', function(){
  var cd=document.querySelector('.rcard.playing');
  if(!cd || !AUDIO.duration) return;
  var bar=cd.querySelector('.cprog');
  if(!bar){ bar=document.createElement('span'); bar.className='cprog'; bar.innerHTML='<i></i>'; cd.appendChild(bar); }
  bar.firstElementChild.style.width=(AUDIO.currentTime/AUDIO.duration*100)+'%';
});
function playSrc(url,nm){
  if(!url) return false;
  if(CURSRC!==url){ AUDIO.src=url; CURSRC=url; }
  var p=AUDIO.play(); if(p&&p.catch)p.catch(function(e){console.warn('[audio] play blocked',e);});
  if(nm) NOWPLAY.nm=nm; NOWPLAY.src=url; NOWPLAY.who=''; NOWPLAY.aid=''; NOWPLAY.tid='';
  S.mini.on=true; S.mini.playing=true;
  return true;
}
function toggleSrc(url,nm){
  if(CURSRC===url && !AUDIO.paused){ AUDIO.pause(); S.mini.playing=false; return false; }
  _clearPlayingUI();
  return playSrc(url,nm);
}
AUDIO.addEventListener('ended',function(){ S.mini.playing=false; CURSRC=''; _clearPlayingUI(); renderMini(); });

/* ── 음악바 시크(중간 듣기) + 시간 표시 ──
   막대를 탭하거나 끌면 그 지점부터 재생된다. 드래그 중에는 시간이 손가락을 따라간다. */
function _mmss(s){ s=Math.max(0,Math.floor(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
let _seekDrag=false;
function paintSeek(ratio){
  const fill=document.getElementById('mfill'), knob=document.getElementById('mknob'),
        cur=document.getElementById('mcur'), dur=document.getElementById('mdur'), buf=document.getElementById('mbuf');
  if(!fill) return;
  const d=isFinite(AUDIO.duration)?AUDIO.duration:0;
  const r=Math.min(1,Math.max(0, ratio!=null?ratio : (d? AUDIO.currentTime/d : 0)));
  fill.style.width=(r*100)+'%'; if(knob) knob.style.left=(r*100)+'%';
  if(cur) cur.textContent=_mmss(ratio!=null ? r*d : AUDIO.currentTime);
  if(dur) dur.textContent=d?_mmss(d):'--:--';
  if(buf){ try{ const b=AUDIO.buffered; buf.style.width=(b&&b.length&&d)?((b.end(b.length-1)/d)*100)+'%':'0%'; }catch(_){ } }
}
function bindSeek(){
  const bar=document.getElementById('mbar'); if(!bar) return;
  paintSeek();
  const ratioAt=e=>{ const r=bar.getBoundingClientRect(), x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    return Math.min(1,Math.max(0, x/(r.width||1))); };
  const seekTo=r=>{ const d=isFinite(AUDIO.duration)?AUDIO.duration:0; if(d){ AUDIO.currentTime=r*d; } paintSeek(); };
  const move=e=>{ if(!_seekDrag)return; e.preventDefault(); paintSeek(ratioAt(e)); };
  const up=e=>{ if(!_seekDrag)return; _seekDrag=false; seekTo(ratioAt(e.changedTouches?{clientX:e.changedTouches[0].clientX}:e));
    document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
    document.removeEventListener('touchmove',move); document.removeEventListener('touchend',up); };
  const down=e=>{ if(!isFinite(AUDIO.duration)||!AUDIO.duration){ offToast('아직 불러오는 중이에요'); return; }
    _seekDrag=true; paintSeek(ratioAt(e));
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
    document.addEventListener('touchmove',move,{passive:false}); document.addEventListener('touchend',up); };
  bar.onmousedown=down; bar.ontouchstart=down;
}

/* ── 앱 안 촬영 화면 (getUserMedia) — 하단 camera 탭 ──
   탭 = 사진, 길게 = 영상. 권한 거부/미지원이면 폰 기본 카메라로 폴백. */
let CAMSTREAM=null, CAMFACING='user', CAMREC=null, CAMCHUNKS=[], CAMHOLD=null, CAMERR='';
let CAMMIC=null;   /* 녹화할 때만 따로 얻는 마이크 스트림 (stopCam 이 위에서 참조하므로 여기서 선언) */
function camView(){
